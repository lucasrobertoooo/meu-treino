/* ============ MESOCICLO: rampa de volume dentro do bloco ============
   O bloco definia séries FIXAS por 12 semanas — progressão de carga existia, de volume não.
   Sobrecarga progressiva é a base do modelo; a rampa é o lado do volume. Mesociclo de 4
   semanas dentro do bloco: 1-2 na base, 3 acumulando (+1 no que é foco), 4 em deload.
   Ressalva honesta: que a rampa seja SUPERIOR a volume fixo alto tem base mais prática
   (modelo MEV/MAV/MRV) que de ensaio controlado — sobrecarga progressiva é que é consenso. */
function mesoSemana(){ return ((blocoSemana()-1) % 4) + 1; }   // 1..4
function emDeload(){
  const ate = ST.meta && ST.meta.deloadAte;
  if(ate && daysBetween(today(), ate) >= 0) return true;        // deload antecipado por fadiga
  return mesoSemana()===4;
}
function faseMeso(){
  if(emDeload()) return {k:'deload', nome:'Deload', nota:'Semana leve. Séries cortadas pela metade — carga igual, sem chegar perto da falha.'};
  const m=mesoSemana();
  if(m<=2) return {k:'base', nome:'Base', nota:'Volume de base. É daqui que a rampa sobe.'};
  return {k:'acumulo', nome:'Acúmulo', nota:'Semana mais pesada: uma série a mais em cada exercício do foco.'};
}
// Séries planejadas do exercício AGORA: bloco + fase do mesociclo
/* ============ RECUPERAÇÃO SUBJETIVA (autorregulação de volume) ============
   Lacuna apontada na auditoria contra a referência da categoria (RP Hypertrophy): a rampa do
   mesociclo subia volume em cronograma fixo, sem perguntar como o corpo respondeu.

   Escolha deliberada de ser ASSIMÉTRICO: o feedback só SEGURA volume, nunca adiciona além do
   planejado. Motivo honesto — a evidência de que sub-recuperação atrapalha adaptação é bem
   mais firme que a de subir volume por sensação boa. A rampa continua sendo o teto; o
   feedback é um freio.

   Uma pergunta por treino concluído, três toques possíveis. Guardado em ST.meta.rec por data
   (sem chave de storage nova, sem migração). */
const REC_OPT = [
  {k:'pesado', rot:'Ainda pesado', sub:'dolorido ou sem força'},
  {k:'ok',     rot:'Normal',       sub:'recuperei bem'},
  {k:'leve',   rot:'Leve',         sub:'sobrou gás'},
];
function recDe(data){ return (ST.meta && ST.meta.rec && ST.meta.rec[data]) || null; }
function setRec(v){
  if(!ST.meta || typeof ST.meta!=='object') ST.meta={};
  if(!ST.meta.rec) ST.meta.rec={};
  if(ST.meta.rec[today()]===v) delete ST.meta.rec[today()]; else ST.meta.rec[today()]=v;
  saveK('meta'); render();
}
function recRecentes(dias){
  const r=(ST.meta && ST.meta.rec) || {}, out=[];
  for(const [d,v] of Object.entries(r)){
    const dif=daysBetween(d, today());
    if(dif>=0 && dif<(dias||9)) out.push(v);
  }
  return out;
}
/* Recuperação ruim = 2+ "ainda pesado" nos últimos 9 dias (cobre um mesociclo de treino
   4x/semana sem depender de qual dia ela respondeu). Exige 2 pra não reagir a um dia ruim. */
function recuperacaoRuim(){
  const r=recRecentes(9);
  return r.length>=2 && r.filter(v=>v==='pesado').length>=2;
}
function recCard(){
  const hoje=recDe(today());
  if(hoje){
    const o=REC_OPT.find(x=>x.k===hoje)||{rot:hoje};
    const freio = hoje==='pesado' && recuperacaoRuim();
    return `<div class="reccard feito">
      <div class="rc-l">Recuperação de hoje</div>
      <div class="rc-v">${esc(o.rot)}${freio?` <span class="rc-freio">volume segurado</span>`:''}</div>
      <button class="rc-undo" onclick="setRec('${hoje}')">mudar</button>
    </div>`;
  }
  return `<div class="reccard">
    <div class="rc-l">Como você chegou hoje?</div>
    <div class="rc-h">Comparado ao último treino igual. Serve pra segurar volume quando você não está recuperando.</div>
    <div class="rc-opts">
      ${REC_OPT.map(o=>`<button class="rc-o rc-${o.k}" onclick="setRec('${o.k}')"><b>${esc(o.rot)}</b><span>${esc(o.sub)}</span></button>`).join('')}
    </div>
  </div>`;
}
function exSets(e){
  if(!e) return 3;
  const ov=BLOCOS[blocoAtual()].sets || {};
  const base = (e.id && ov[e.id]) || parseInt(e.s) || 3;
  if(emDeload()) return Math.max(1, Math.round(base*0.5));      // deload corta tudo pela metade
  if(mesoSemana()===3 && !recuperacaoRuim()){   // o freio da recuperação segura o +1
    // acúmulo: +1 só nos músculos que são foco do bloco (tier 1-2)
    const foco = Object.entries(e.mg||{}).some(([mg,w])=>w>=1 && tierOf(mg)<=2);
    return foco ? base+1 : base;
  }
  return base;
}
function anteciparDeload(){
  if(!confirm('Fazer a semana leve agora?\n\nAs séries caem pela metade por 7 dias. Serve pra descarregar fadiga acumulada — a carga continua a mesma, só não vá perto da falha.')) return;
  if(!ST.meta || typeof ST.meta!=='object') ST.meta={};
  ST.meta.deloadAte = dateAdd(today(), 6);
  saveK('meta'); registrarDeloadEmCurso(); render(); showToast('Semana leve começou', 'ok', 2400);
}
// Peso do tier na pontuação: 1=3, 2=2, 3=1, 4=0
function tierWeight(mg){ return Math.max(0, 4-tierOf(mg)); }
let MG_PRIORITY = {};
function recalcPrioridades(){
  MG_PRIORITY = {};
  for(const [mg,t] of Object.entries(BLOCOS[blocoAtual()].tier||{})) if(t<=3) MG_PRIORITY[mg]=true;

/* ============ REVISÃO NA VIRADA DE BLOCO ============
   A troca de exercício só disparava por plateau (plateau + deload feito + 6 semanas), e o
   gatilho antigo de "12 semanas" tinha sido removido por ficar aceso pra sempre. Com isso o
   app perdeu qualquer noção de TEMPO CERTO. A virada de bloco é o momento natural: o
   programa já vai mudar de ênfase, então é quando rotacionar o que estagnou — sem banner
   permanente incomodando no meio do caminho.
   Só olha ISOLADORES: composto é a base, não se troca por não ter subido 2kg. */
function acessoriosParados(){
  const desde=blocoDesde(); if(!desde) return [];
  const out=[];
  for(const d of ['A','B','C','D']){
    const ex=(WK[d]&&WK[d].ex)||[];
    ex.forEach((e,i)=>{
      if(e.t!=='iso') return;
      const id=exId(d,i);
      const h=progressSessions(id).filter(x=>sessionTop(x.sets) && x.date>=desde);
      if(h.length<3) return;                     // pouco dado no bloco: não julga
      const ini=sessionTop(h[0].sets), fim=sessionTop(h[h.length-1].sets);
      if(cmpTop(fim,ini)<=0){
        out.push({id, dia:d, nome:exName(e), sess:h.length,
                  alts:(EXERCISE_ALTERNATIVES[e.n]||[]).slice(0,3)});
      }
    });
  }
  return out;
}
function trocarBloco(){
  const alvo = blocoAtual()==='peito_bracos' ? 'perna' : 'peito_bracos';
  if(!confirm(`Virar pro bloco de ${BLOCOS[alvo].nome}?\n\n${BLOCOS[alvo].resumo}\n\nO histórico não muda — só as séries planejadas e as prioridades.`)) return;
  if(!ST.meta || typeof ST.meta!=='object') ST.meta={};
  ST.meta.bloco=alvo; ST.meta.blocoDesde=today();
  delete ST.meta.foco;   // o bloco novo traz o próprio padrão de foco
  saveK('meta'); recalcPrioridades(); render();
  showToast('Bloco de '+BLOCOS[alvo].nome+' começou', 'ok', 2600);
}

function sumMacros(entries){
  let p=0,c=0,k=0;
  for(const e of entries||[]){ p+=+(e.p||0); c+=+(e.c||0); k+=+(e.k||0); }
  return {p,c,k};
}
// Normaliza string pra busca (remove acentos, lowercase)
function normTxt(s){ return String(s||"").toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,''); }
function searchFoods(q){
  q=normTxt(q).trim(); if(!q) return [];
  const terms=q.split(/\s+/);
  return FOOD_DB.map((f,i)=>({f,i}))
    .filter(({f})=>{ const t=normTxt(f.n)+' '+normTxt(f.q); return terms.every(tm=>t.includes(tm)); })
    .slice(0,12);
}

  if(!Array.isArray(ST.protein[date])) ST.protein[date]=[];
}
// Migração defensiva: session deve ter shape {active, history}
if(!ST.session || typeof ST.session!=='object'){ ST.session={active:null, history:[]}; }
if(!('active' in ST.session)) ST.session.active=null;
if(!Array.isArray(ST.session.history)) ST.session.history=[];
// Migração defensiva: freelog deve ser objeto {sessionId: [{date, sets}]}
if(!ST.freelog || typeof ST.freelog!=='object' || Array.isArray(ST.freelog)) ST.freelog={};
// Migração defensiva: exmeta = {exId: {n?, cue?, note?}} — overrides do usuário por exercício

// Migração defensiva: photometa = [{id, date, angle}] — metadados das fotos (pixels no IndexedDB)
if(!Array.isArray(ST.photometa)) ST.photometa=[];

/* Migração ÚNICA 2026-07-08.03 — core movido de B/D para A/C.
   ST.logs é keyado por POSIÇÃO (`${dia}_${idx}`), não pelo id estável do exercício.
   Ao tirar os 2 abdominais de B/D, tudo que vinha depois deles sobe de índice — então
   sem remapear, o histórico do core ficaria órfão E a panturrilha herdaria os dados errados.
   Remapeamentos: abdominais B->A e D->C; panturrilha B_9->B_7 e D_10->D_8.
   Idempotente via flag em ST.meta. exmeta NÃO precisa migrar (ancorado no id estável). */
if(!ST.meta || typeof ST.meta!=='object') ST.meta={};
if(!ST.meta.coreToACMigratedV1){
  const REMAP = {B_7:'A_6', B_8:'A_7', B_9:'B_7', D_8:'C_6', D_9:'C_7', D_10:'D_8'};
  if(Object.keys(REMAP).some(k=>ST.logs && ST.logs[k]!==undefined)){
    const next={};
    // 1) chaves não afetadas passam direto
    for(const k of Object.keys(ST.logs)){ if(!(k in REMAP)) next[k]=ST.logs[k]; }
    // 2) remaps aplicados por último = fonte de verdade (evita ordem de iteração decidir empate)
    for(const from of Object.keys(REMAP)){ if(ST.logs[from]!==undefined) next[REMAP[from]]=ST.logs[from]; }
    ST.logs=next;
    saveK('logs');
    console.log('[migração] core B/D -> A/C: chaves de log remapeadas');
  }
  ST.meta.coreToACMigratedV1=true;
  saveK('meta');
}

/* ============ FOTOS: IndexedDB (pixels) + metadados em ST.photometa ============
   Pixels (base64) vão pro IndexedDB — sem o teto de ~5MB do localStorage, então o
   histórico de fotos cresce à vontade sem manutenção. Metadados leves {id,date,angle}
   ficam em ST.photometa (renderizam rápido e entram no backup de dados).
   Se o IndexedDB não existir/falhar, as fotos ficam no fallback ST.photos (localStorage),
   nunca some nada silenciosamente. */
const PDB_NAME='meutreino_photos', PDB_STORE='photos', PDB_VER=1;
let _pdb=null;
function idbReady(){ try{ return typeof indexedDB!=='undefined' && !!indexedDB; }catch(e){ return false; } }
function pdbOpen(){
  return new Promise((res,rej)=>{
    if(_pdb) return res(_pdb);
    if(!idbReady()) return rej(new Error('no-indexeddb'));
    let req; try{ req=indexedDB.open(PDB_NAME, PDB_VER); }catch(e){ return rej(e); }
    req.onupgradeneeded=()=>{ const db=req.result; if(!db.objectStoreNames.contains(PDB_STORE)) db.createObjectStore(PDB_STORE); };
    req.onsuccess=()=>{ _pdb=req.result; res(_pdb); };
    req.onerror=()=>rej(req.error);
  });
}
function pdbPut(id, dataUrl){ return pdbOpen().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(PDB_STORE,'readwrite'); tx.objectStore(PDB_STORE).put(dataUrl, id); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('abort')); })); }
function pdbGet(id){ return pdbOpen().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(PDB_STORE,'readonly'); const r=tx.objectStore(PDB_STORE).get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); })); }
function pdbDel(id){ return pdbOpen().then(db=>new Promise((res,rej)=>{ const tx=db.transaction(PDB_STORE,'readwrite'); tx.objectStore(PDB_STORE).delete(id); tx.oncomplete=()=>res(true); tx.onerror=()=>rej(tx.error); })); }
function pdbAllKeys(){ return pdbOpen().then(db=>new Promise((res,rej)=>{ const r=db.transaction(PDB_STORE,'readonly').objectStore(PDB_STORE).getAllKeys(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); })); }

function nextPhotoId(){ ST.meta.photoSeq=(ST.meta.photoSeq||0)+1; return 'p'+ST.meta.photoSeq; }

// Migração NÃO-DESTRUTIVA das fotos antigas (base64 em ST.photos) -> IndexedDB.
// Só remove do localStorage o que foi confirmado gravado no IDB. Idempotente (esvazia ST.photos).
async function migratePhotosToIDB(){
  if(!Array.isArray(ST.photos) || !ST.photos.length) return;
  if(!idbReady()) return; // sem IDB: mantém no fallback, tenta de novo noutro boot
  let moved=0, failed=0; const remaining=[];
  for(const p of ST.photos){
    if(!p || !p.dataUrl){ continue; }
    const id=nextPhotoId();
    try{
      await pdbPut(id, p.dataUrl);
      ST.photometa.push({id, date:p.date||today(), angle:p.angle||'front'});
      moved++;
    }catch(e){ failed++; remaining.push(p); }
  }
  if(moved){ ST.photometa.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0)); saveK('photometa'); saveK('meta'); }
  ST.photos=remaining; saveK('photos');
  if(moved){ console.log('[migração] '+moved+' foto(s) -> IndexedDB'+(failed?(' ('+failed+' mantidas no localStorage)'):'')); if(typeof tab!=='undefined' && tab==='corpo'){ try{ render(); }catch(e){} } }
}

// Metadados de foto ordenados; filtro por ângulo.
function photosMeta(){ return (ST.photometa||[]).slice().sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0)); }
function photosByAngle(angle){ return photosMeta().filter(p=>p.angle===angle); }
// Rótulo amigável dos 3 ângulos base; qualquer outro (custom) usa o próprio texto.
function angleLabel(a){ return ({front:'Frente', side:'Lado', back:'Costas'})[a] || a; }
// Ângulos presentes nas fotos: os 3 base primeiro (se têm foto), depois os customizados.
function anglesPresent(){
  const base=['front','side','back'].filter(a=>photosByAngle(a).length);
  const custom=[...new Set(photosMeta().map(p=>p.angle))].filter(a=>!['front','side','back'].includes(a));
  return base.concat(custom);
}
// Preenche <img data-pid> com o pixel do IDB depois do render (async, tolera erro).
function hydratePhotos(root){
  const scope=root||document;
  scope.querySelectorAll('img[data-pid]').forEach(img=>{
    const id=img.getAttribute('data-pid'); if(!id || img.dataset.loaded) return;
    pdbGet(id).then(url=>{ if(url){ img.src=url; img.dataset.loaded='1'; } }).catch(()=>{});
  });
}

/* ============ WORKOUT SESSION (start/pause/resume/end + duration) ============ */
function fmtDuration(ms){
  if(!ms || ms<0) ms=0;
  const sec=Math.floor(ms/1000);
  const h=Math.floor(sec/3600);
  const m=Math.floor((sec%3600)/60);
  const s=sec%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function getSessionElapsed(){
  const s=ST.session && ST.session.active;
  if(!s) return 0;
  const now=Date.now();
  const totalMs=now-s.startAt;
  const pausedMs=(s.pausedTotal||0)+(s.pausedAt?now-s.pausedAt:0);
  return Math.max(0, totalMs-pausedMs);
}
function isSessionPaused(){
  return !!(ST.session && ST.session.active && ST.session.active.pausedAt);
}
function isSessionActive(){
  return !!(ST.session && ST.session.active);
}
function startSession(workoutId){
  if(ST.session.active){
    if(!confirm(`Já tem treino ${ST.session.active.workoutId} em progresso (${fmtDuration(getSessionElapsed())}). Substituir?`)) return false;
  }
  ST.session.active={workoutId, startAt:Date.now(), pausedAt:null, pausedTotal:0};
  saveK('session');
  updateSessionDisplays();
  updateFabMenu();
  showToast(`Treino ${workoutId} iniciado`, 'ok', 1800);
  return true;
}
function pauseSession(){
  const s=ST.session.active;
  if(!s || s.pausedAt) return;
  s.pausedAt=Date.now();
  saveK('session');
  updateSessionDisplays();
  updateFabMenu();
  showToast(`Treino pausado`, 'info', 1500);
}
function resumeSession(){
  const s=ST.session.active;
  if(!s || !s.pausedAt) return;
  s.pausedTotal=(s.pausedTotal||0)+(Date.now()-s.pausedAt);
  s.pausedAt=null;
  saveK('session');
  updateSessionDisplays();
  updateFabMenu();
  showToast(`Treino retomado`, 'ok', 1500);
}
function endSession(silent=false){
  const s=ST.session.active;
  if(!s) return null;
  const endAt=Date.now();
  const totalMs=endAt-s.startAt;
  const pausedMs=(s.pausedTotal||0)+(s.pausedAt?endAt-s.pausedAt:0);
  const activeMs=Math.max(0, totalMs-pausedMs);
  // Conta sets válidos do treino hoje
  const t=todayISO();
  let setsN=0, volume=0;
  const W=WK[s.workoutId];
  if(W){
    W.ex.forEach((e,i)=>{
      const id=exId(s.workoutId,i);
      const tod=todaySession(id);
      if(tod){
        tod.sets.forEach(set=>{
          if(isValidDone(set)){
            setsN++;
            volume += num(set.kg)*num(set.reps);
          }
        });
      }
    });
  }
  const record={date:t, workoutId:s.workoutId, startAt:s.startAt, endAt, durationMs:totalMs, activeMs, sets:setsN, volume:Math.round(volume)};
  ST.session.history.push(record);
  ST.session.active=null;
  saveK('session');
  updateSessionDisplays();
  updateFabMenu();
  if(!silent) showToast(`Treino encerrado · ${fmtDuration(activeMs)}`, 'ok', 2200);
  return record;
}
function manualStartSession(){
  // Determina qual treino: openDay (se tem treino aberto) > suggestedNextDay
  const wkId = (typeof openDay==='string' && openDay) ? openDay : suggestedNextDay();
  startSession(wkId);
}
function toggleSessionPauseResume(){
  if(!isSessionActive()) return;
  if(isSessionPaused()) resumeSession();
  else pauseSession();
}
function manualEndSession(){
  if(!isSessionActive()) return;
  const wk=ST.session.active.workoutId;
  if(!confirm(`Encerrar treino agora? (duração: ${fmtDuration(getSessionElapsed())})`)) return;
  // Se o workout já tem sets feitos hoje, mostra celebração com resumo; senão só encerra
  const W=WK[wk];
  const hasAnySets = W && W.ex.some((_,i)=>{
    const tod=todaySession(exId(wk,i));
    return tod && tod.sets.some(isValidDone);
  });
  if(hasAnySets && !alreadyCelebratedToday(wk)){
    showCelebration(wk);
  } else {
    endSession();
  }
}
function updateSessionDisplays(){
  // Header do treino aberto
  const hdrEl=document.getElementById('sessionElapsed');
  if(hdrEl){
    const s=ST.session.active;
    const sameWk = s && (openDay===s.workoutId);
    if(s && sameWk){
      hdrEl.textContent = fmtDuration(getSessionElapsed());
      hdrEl.parentElement && hdrEl.parentElement.classList.toggle('paused', !!s.pausedAt);
      hdrEl.parentElement && hdrEl.parentElement.classList.remove('hidden');
    } else if(hdrEl.parentElement){
      hdrEl.parentElement.classList.add('hidden');
    }
  }
  // Badge no FAB
  const fabBadge=document.getElementById('fabSessionBadge');
  if(fabBadge){
    if(isSessionActive()){
      fabBadge.textContent = fmtDuration(getSessionElapsed());
      fabBadge.classList.remove('hidden');
      fabBadge.classList.toggle('paused', isSessionPaused());
    } else {
      fabBadge.classList.add('hidden');
    }
  }
}
// tick a cada 1s pra atualizar timer de sessão
setInterval(()=>{
  if(isSessionActive()) updateSessionDisplays();
}, 1000);

/* ============ CELEBRATION (item 10) ============ */
function isWorkoutComplete(day){
  // Auto-trigger só em 100% dos sets planejados feitos (evita false positive)
  // Pra encerrar com volume parcial, usar FAB → Parar treino
  const W=WK[day]; if(!W) return false;
  let plannedTotal=0, doneTotal=0;
  W.ex.forEach((e,i)=>{
    plannedTotal += exSets(e);
    const tod=todaySession(exId(day,i));
    if(tod) doneTotal += tod.sets.filter(isValidDone).length;
  });
  return plannedTotal>0 && doneTotal>=plannedTotal;
}
function alreadyCelebratedToday(day){
  const t=todayISO();
  return ST.session.history.some(h=>h.date===t && h.workoutId===day);
}
function gatherWorkoutSummary(day){
  const t=todayISO();
  const W=WK[day];
  let setsN=0, volume=0, prs=[], topProgress=null;
  W.ex.forEach((e,i)=>{
    const id=exId(day,i);
    const tod=todaySession(id);
    if(!tod) return;
    tod.sets.forEach(set=>{
      if(isValidDone(set)){
        setsN++;
        volume += num(set.kg)*num(set.reps);
      }
    });
    if(isPRSession(id, tod.sets)){
      const e1=bestE1RM(tod.sets);
      prs.push({name:exName(e), e1:Math.round(e1*10)/10, kg:Math.max(...tod.sets.filter(s=>isValidDone(s)).map(s=>num(s.kg)))});
    }
    // Progressão simples vs sessão anterior
    if(!topProgress){
      const lastS=lastSession(id);
      if(lastS){
        const curE=bestE1RM(tod.sets);
        const lastE=bestE1RM(lastS.sets);
        if(curE>lastE && lastE>0){
          topProgress={name:exName(e), delta:Math.round((curE-lastE)*10)/10};
        }
      }
    }
  });
  return {setsN, volume:Math.round(volume), prs, topProgress};
}
function showCelebration(day){
  const W=WK[day];
  const summary=gatherWorkoutSummary(day);
  const record=endSession(true); // silent: celebration mostra duração
  const durMs = record ? record.activeMs : 0;
  const streak = getStreak();
  let hero;
  if(summary.prs.length){
    const top=summary.prs[0];
    hero = `<div class="celeb-hero pr">🏆 <b>PR novo!</b><br><span class="celeb-pr-line">${esc(top.name)} · e1RM ${top.e1}kg</span></div>`;
  } else if(summary.topProgress){
    hero = `<div class="celeb-hero progress">↑ <b>+${summary.topProgress.delta}kg e1RM</b><br><span class="celeb-pr-line">${esc(summary.topProgress.name)}</span></div>`;
  } else {
    hero = `<div class="celeb-hero done">✓ <b>Treino completo</b><br><span class="celeb-pr-line">Consistência é tudo.</span></div>`;
  }
  const html = `
    <div class="celeb-card">
      <div class="celeb-title">Treino ${day} completo 💪</div>
      ${hero}
      <div class="celeb-stats">
        <div class="celeb-stat"><div class="l">Duração</div><div class="v">${fmtDuration(durMs)}</div></div>
        <div class="celeb-stat"><div class="l">Sets</div><div class="v">${summary.setsN}</div></div>
        <div class="celeb-stat"><div class="l">Volume</div><div class="v">${summary.volume}<small>kg</small></div></div>
        <div class="celeb-stat"><div class="l"><span style="display:inline-flex;vertical-align:-3px;margin-right:3px">${I.flame}</span>Streak</div><div class="v">${streak}<small> dias</small></div></div>
      </div>
      <button class="celeb-ok" onclick="closeCelebration()">OK, voltar pra Home</button>
    </div>`;
  const el=document.getElementById('celebration');
  if(!el) return;
  el.innerHTML=html;
  el.classList.remove('hidden');

/* ============ Phantom session cleanup (audit B fix) ============ */
function cleanupPhantomSessions(){
  const t=todayISO();
  let cleaned=0;
  for(const id in ST.logs){
    if(!Array.isArray(ST.logs[id])) continue;
    const before=ST.logs[id].length;
    // Mantém: sessões com pelo menos 1 set válido OU sessão de hoje (em progresso) OU com comentário
    ST.logs[id]=ST.logs[id].filter(sess => (sess && sess.date===t) || hasValidDoneSafe(sess && sess.sets) || (sess && sess.cmt));
    cleaned += before - ST.logs[id].length;
    if(!ST.logs[id].length) delete ST.logs[id];
  }
  if(cleaned>0){
    saveK('logs');
    console.log(`[boot] limpou ${cleaned} sessão(ões) fantasma`);
  }
}
/* Data no fuso LOCAL (não UTC). `toISOString()` devolve UTC: no Brasil (UTC-3) tudo que
   fosse registrado das 21h à meia-noite ganhava a data de AMANHÃ — sets, peso, sono, macros,
   medidas e comentários caíam no dia errado, quebrando streak, "treino de hoje" e a rotação ABCD. */
function localISO(d){
  const x = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate());
}
function todayISO(){ return localISO(); }
function hasValidDoneSafe(sets){
  if(!Array.isArray(sets)) return false;
  return sets.some(s => s && s.done && parseFloat(String(s.kg||'').replace(',','.'))>0 && parseFloat(String(s.reps||'').replace(',','.'))>0);
}

/* ============ Persistent storage + quota check ============ */
async function requestPersistentStorage(){
  try{
    if(navigator.storage && navigator.storage.persist){
      const already=await navigator.storage.persisted?.();
      if(!already){ await navigator.storage.persist(); }
    }
  }catch(e){}
}
async function checkStorageQuota(){
  try{
    if(navigator.storage && navigator.storage.estimate){
      const {usage=0, quota=0} = await navigator.storage.estimate();
      if(quota>0 && usage/quota > 0.80){
        showToast(`Storage ${Math.round(usage/quota*100)}% cheio — faça backup`, 'warn', 5000);
      }
    }
  }catch(e){}
}
function checkBackupReminder(){
  // Lembrete semanal de backup (C-1): nag se passou >7d desde o último export
  if(!ST.logs || !Object.keys(ST.logs).length) return; // sem dados, não nag
  const last=ST.meta && ST.meta.lastBackupAt;
  if(!last){
    // Nunca fez backup — só nag se já tem dados acumulados
    showToast(`Faça o 1º backup (Mais → Exportar)`, 'info', 4500);
    return;
  }
  const days=Math.floor((Date.now()-last)/86400000);
  if(days>=7){
    showToast(`Último backup há ${days} dias — exporta novo`, 'warn', 4500);
  }
}
function today(){ return localISO(); }
function dateAdd(iso, days){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+days); return localISO(d); }
function daysBetween(a,b){ const da=new Date(a+'T12:00:00'), db=new Date(b+'T12:00:00'); return Math.round((db-da)/86400000); }
function exId(day,i){ return day+"_"+i; }

/* ============ OVERRIDES DE EXERCÍCIO (edição do usuário, isolado em ST.exmeta) ============
   Ancorado pelo id ESTÁVEL do exercício (e.id no WK/HOME_SESSIONS), não pela posição.
   Assim reordenar/renomear no código não faz a edição migrar pro exercício errado.
   Git nunca vê isto (mora só no localStorage). Entra no backup via LS/exmeta. */
function exOverride(e){ return (e && e.id && ST.exmeta[e.id]) || {}; }
// Nome/cue exibidos = override do usuário se houver, senão o padrão do código.
function exName(e){ const o=exOverride(e); return (o.n!=null && o.n!=='') ? o.n : e.n; }
function exCue(e){ const o=exOverride(e); return (o.cue!=null && o.cue!=='') ? o.cue : e.cue; }
function exNote(e){ const o=exOverride(e); return (o.note!=null) ? o.note : ''; }
function exHasOverride(e){ const o=exOverride(e); return !!(o.n || o.cue || (o.note && o.note.trim())); }
function saveExMeta(id, patch){
  if(!id) return;
  const cur = ST.exmeta[id] || {};
  const next = {...cur, ...patch};
  // limpa campos vazios pra não inflar storage nem mascarar mudanças futuras do código
  for(const k of ['n','cue','note']){ if(next[k]==null || String(next[k]).trim()==='') delete next[k]; }
  if(Object.keys(next).length) ST.exmeta[id]=next; else delete ST.exmeta[id];
  saveK('exmeta');
}
function resetExMeta(id){ if(id && ST.exmeta[id]){ delete ST.exmeta[id]; saveK('exmeta'); } }
// Acha o exercício ORIGINAL (padrão do código) pelo id estável, varrendo WK + HOME_SESSIONS.
function exById(id){
  if(!id) return null;
  for(const d of Object.keys(WK)){ const f=WK[d].ex.find(x=>x.id===id); if(f) return f; }
  for(const t of Object.keys(HOME_SESSIONS)){ const f=HOME_SESSIONS[t].ex.find(x=>x.id===id); if(f) return f; }
  return null;
}

/* ---- Modal de edição de exercício ---- */
let exEditId=null;
function cuePlain(c){ return String(c||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim(); }
function openExEdit(id){
  const orig=exById(id);
  if(!orig){ showToast('Exercício não encontrado', 'warn'); return; }
  exEditId=id;
  const o=ST.exmeta[id]||{};
  const defCue=cuePlain(orig.cue);
  document.getElementById('exEditName').value = o.n!=null?o.n:orig.n;
  document.getElementById('exEditCue').value  = o.cue!=null?o.cue:(defCue==='—'?'':defCue);
  document.getElementById('exEditNote').value = o.note!=null?o.note:'';
  const hasOv=!!(o.n||o.cue||(o.note&&o.note.trim()));
  document.getElementById('exEditReset').classList.toggle('hidden', !hasOv);
  document.getElementById('exEditHint').textContent = hasOv
    ? 'Já editado por você. Fica só neste iPhone e entra no backup — atualizações do app não sobrescrevem.'
    : 'O que você editar fica só neste iPhone e entra no backup. Não vai pro código nem é sobrescrito por atualizações.';
  document.getElementById('exEdit').classList.remove('hidden');
  setTimeout(()=>{ try{ document.getElementById('exEditName').focus(); }catch(e){} }, 60);
}
function closeExEdit(){ document.getElementById('exEdit').classList.add('hidden'); exEditId=null; }
function saveExEdit(){
  if(!exEditId) return;
  const orig=exById(exEditId)||{};
  let n=document.getElementById('exEditName').value.trim();
  let cue=document.getElementById('exEditCue').value.trim();
  const note=document.getElementById('exEditNote').value.trim();
  // Se igual ao padrão do código, não grava override — deixa o exercício acompanhar futuras
  // atualizações do app em vez de "congelar" o texto atual.
  if(n===String(orig.n||'').trim()) n='';
  if(cue===cuePlain(orig.cue)) cue='';
  saveExMeta(exEditId, {n, cue, note});
  closeExEdit();
  render();
  showToast('Exercício atualizado', 'ok');
}
function resetExEdit(){
  if(!exEditId) return;
  if(!confirm('Restaurar nome, descrição e nota originais deste exercício?')) return;
  resetExMeta(exEditId);
  closeExEdit();
  render();
  showToast('Voltou ao padrão', 'ok');
}

function dailyPrincipleIdx(){
  // Rotação determinística por dia do ano (mesma dica no mesmo dia entre sessões)
  const t=new Date();
  const start=new Date(t.getFullYear(),0,0);
  const diff=t-start;
  const dayOfYear=Math.floor(diff/86400000);
  return dayOfYear % (typeof PRINC!=='undefined'?PRINC.length:12);
}
function prTrackerForWorkout(day){
  if(!WK[day]) return [];
  const out=[];
  WK[day].ex.forEach((e,i)=>{
    const id=exId(day,i);
    const best=historicalBestE1RM(id, true);
    if(best>0){ out.push({name:exName(e), e1:Math.round(best*10)/10}); }
  });
  out.sort((a,b)=>b.e1-a.e1);
  return out.slice(0,3);
}

function lastSession(id){
  const h=progressSessions(id); if(!h||!h.length) return null;   // respeita a fronteira de troca
  const t=today();
  for(let k=h.length-1;k>=0;k--){ if(h[k].date!==t) return h[k]; }
  return null;
}
function todaySession(id){
  const h=ST.logs[id]; if(!h) return null;
  const t=today(); return h.find(s=>s.date===t)||null;
}
function upsertToday(id, sets){
  if(!ST.logs[id]) ST.logs[id]=[];
  const t=today();
  const ex=ST.logs[id].find(s=>s.date===t);
  if(ex) ex.sets=sets; else ST.logs[id].push({date:t, sets});
  saveK('logs');
}

/* Comentário do DIA por exercício — anexado ao registro da sessão (campo cmt).
   Diferente da "nota" (exmeta), que é permanente. Ex: "hoje fiz na outra máquina",

// Comentários ANTERIORES de um exercício (exclui o de hoje, que já está no input),
// mais recentes primeiro. store: 'log' (ABCD) ou 'free' (casa).
function commentsFor(id, store){
  const arr=(store==='free'?ST.freelog[id]:ST.logs[id])||[];
  const t=today();
  return arr.filter(s=>s && s.cmt && s.date!==t)
    .slice().sort((a,b)=> a.date<b.date?1:(a.date>b.date?-1:0));
}
// Datas em que qualquer sessão livre teve set válido (kg pode ser 0 pra calistenia)
function freeWorkoutDates(){
  const set=new Set();
  for(const id of Object.keys(ST.freelog)){
    for(const sess of (ST.freelog[id]||[])){
      if((sess.sets||[]).some(s=>s&&s.done&&num(s.reps)>0)) set.add(sess.date);
    }
  }
  return Array.from(set).sort();
}
// Última sessão livre (de qualquer template) na data dada
function freeSessionsOnDate(date){
  const out=[];
  for(const id of Object.keys(ST.freelog)){
    const sess=(ST.freelog[id]||[]).find(s=>s.date===date);
    if(sess && (sess.sets||[]).some(s=>s&&s.done&&num(s.reps)>0)){
      // id é "templateId_exIdx" — extrai templateId
      const templateId=id.split("_").slice(0,-1).join("_");
      out.push({templateId, exIdx:+id.split("_").slice(-1)[0], sess});
    }
  }
  return out;
}
// Templates únicos completados na data
function homeTemplatesCompletedOn(date){
  const sessions=freeSessionsOnDate(date);
  return Array.from(new Set(sessions.map(s=>s.templateId)));
}
/* Ranqueia HOME_SESSIONS pelo próximo dia ABCD agendado.
   Retorna array ordenado [{id, tmpl, score, tier, reason}] onde tier ∈ "best"|"ok"|"avoid".
   tier "best" = complementa explicitamente; "avoid" = compete com foco; "ok" = neutro.
*/
function pickHomeSessions(nextDay){
  const out=[];
  for(const [id,tmpl] of Object.entries(HOME_SESSIONS)){
    let score=0; let tier="ok"; let reason="";
    if(tmpl.bestBefore && tmpl.bestBefore.includes(nextDay)){
      score+=30; tier="best"; reason=`Complementa o treino ${nextDay} de amanhã`;
    }
    if(tmpl.avoidBefore && tmpl.avoidBefore.includes(nextDay)){
      score-=50; tier="avoid"; reason=`Sobrepõe com o foco do treino ${nextDay} de amanhã`;
    }
    // Bonus se canSkipNextDay tem entrada pro próximo dia (mais palpável pro usuário)
    const skip=tmpl.canSkipNextDay && tmpl.canSkipNextDay[nextDay];
    if(skip && skip.length){
      score+=20;
      if(tier!=="avoid"){
        reason=reason || `Faz e pode pular ${skip.length} exercício${skip.length>1?'s':''} amanhã`;
      }
    }
    // Bonus se mg principal foca em prioridade (ombro_lat, peito_sup, biceps, triceps)
    for(const mg of Object.keys(tmpl.ex[0]?.mg||{})){
      if(MG_PRIORITY[mg]) score+=10;
    }
    // Core sempre tem +5 (sub-treinado em ABCD Push/Pull)
    if(id==="core_completo") score+=15;
    out.push({id, tmpl, score, tier, reason});
  }
  out.sort((a,b)=>b.score-a.score);
  return out;
}

/* ============ PROGRESSÃO: e1RM, PR, SUGESTÃO, PLATEAU ============ */
function num(v){ const n=parseFloat(String(v||"").replace(",",".")); return isFinite(n)?n:0; }
// Brzycki 1RM: kg / (1.0278 - 0.0278*reps), capped at reps 12 (acima degrada)
function e1RM(kg, reps){
  kg=num(kg); reps=num(reps);
  if(kg<=0||reps<=0) return 0;
  return kg / (1.0278 - 0.0278*Math.min(reps,12));
}
function bestE1RM(sets){
  if(!sets||!sets.length) return 0;
  return Math.max(0, ...sets.filter(s=>s&&num(s.kg)>0&&num(s.reps)>0).map(s=>e1RM(s.kg,s.reps)));
}
// PR detection: max e1RM histórico antes da sessão de hoje
function historicalBestE1RM(id, excludeToday=true){
  const h=ST.logs[id]||[]; const t=today();
  let best=0;
  for(const sess of h){
    if(excludeToday && sess.date===t) continue;
    const b=bestE1RM(sess.sets);
    if(b>best) best=b;
  }
  return best;
}
function isPRSession(id, sets){
  const cur=bestE1RM(sets);
  if(cur<=0) return false;
  const prev=historicalBestE1RM(id, true);
  if(prev<=0) return false; // primeira sessão de um exercício não conta como PR
  return cur > prev + 0.1;
}

// Parse range "8-12" → {min:8, max:12}
function parseRange(r){
  const m=String(r).match(/(\d+)\s*-\s*(\d+)/);
  if(m) return {min:+m[1], max:+m[2]};
  const n=parseInt(r); return n? {min:n,max:n} : {min:8,max:12};
}
/* TROCA DE EXERCÍCIO — fronteira, não apagamento.
   Ao marcar "Troquei", grava a data em ST.meta.swapAt[id]. As funções de progressão só olham
   sessões a partir dela: as cargas do exercício antigo (ex: supino halter 30kg) param de
   contaminar as sugestões do novo (ex: máquina 50kg). Nada é deletado — o histórico continua
   no storage e no backup. Sem swapAt gravado, o comportamento é idêntico ao de antes. */
function progressSessions(id){
  const all=ST.logs[id]||[];
  const from=(ST.meta&&ST.meta.swapAt&&ST.meta.swapAt[id])||null;
  return from ? all.filter(s=>s&&s.date>=from) : all;
}
function markExerciseSwapped(id){
  if(!confirm('Marcar que você trocou este exercício?\n\nO histórico antigo é preservado, mas as sugestões de carga recomeçam do zero — as cargas do exercício anterior não valem pro novo.')) return;
  if(!ST.meta||typeof ST.meta!=='object') ST.meta={};
  if(!ST.meta.swapAt) ST.meta.swapAt={};
  ST.meta.swapAt[id]=today();
  if(ST.meta.swapSnooze) delete ST.meta.swapSnooze[id];
  saveK('meta'); render(); showToast('Progressão reiniciada pro exercício novo','ok',2600);
}
function snoozeSwap(id){
  if(!ST.meta||typeof ST.meta!=='object') ST.meta={};
  if(!ST.meta.swapSnooze) ST.meta.swapSnooze={};
  ST.meta.swapSnooze[id]=dateAdd(today(), 56); // 8 semanas
  saveK('meta'); render(); showToast('Ok — não sugiro trocar por 8 semanas','ok',2400);
}
function swapSnoozed(id){
  const until=(ST.meta&&ST.meta.swapSnooze&&ST.meta.swapSnooze[id])||null;
  return !!(until && until>today());
}

/* Passo de carga que a academia REALMENTE tem: infere pelas cargas já usadas neste exercício
   em vez de chutar (evita sugerir 22.5kg numa máquina que só tem placas de 5, ou 2.5 num
   par de halteres que anda de 2 em 2). Precisa de ≥2 cargas distintas; senão usa o padrão.
   Zero configuração e se auto-corrige conforme você registra. */
function inferLoadStep(id){
  const vals=[...new Set(progressSessions(id).flatMap(s=>(s.sets||[]).map(x=>num(x.kg))).filter(v=>v>0))];
  if(vals.length<2) return 0;
  for(const step of [5,2.5,2,1]){
    if(vals.every(v=>Math.abs(v/step-Math.round(v/step))<1e-9)) return step;
  }
  return 0;
}
/* Passo do APP INTEIRO, pro caso em que o exercício sozinho não tem o que ensinar.
   É o pior caso e o mais comum: enquanto travado, o exercício nunca acumula 2 cargas
   distintas pra inferir, e aí o padrão de 1kg (isolador abaixo de 20kg) sugere uma carga
   que não existe em polia nem em halter. Aí o app cria o platô que depois diagnostica. */
function globalLoadStep(){
  const vals=new Set();
  for(const id of Object.keys(ST.logs||{}))
    for(const s of (ST.logs[id]||[]))
      for(const x of (s.sets||[])){ const v=num(x.kg); if(v>0) vals.add(v); }
  const uniq=[...vals];
  if(uniq.length<2) return 0;
  for(const step of [5,2.5,2,1]){
    if(uniq.every(v=>Math.abs(v/step-Math.round(v/step))<1e-9)) return step;
  }
  return 0;
}
function loadStepFor(id, e){ return inferLoadStep(id) || globalLoadStep() || 0; }

// Sugestão baseada na última sessão: se TOP set bateu top range com mesma kg, sugere +incremento; senão +1 rep ou repete.
/* Núcleo da sugestão, rodando sobre QUALQUER sessão (não só a última). Rodar sobre a
   penúltima é o que permite ao app saber o que ele mesmo aconselhou e comparar com o que
   aconteceu, sem gravar nada e sem migração. */
function suggestFrom(sets, e, id){
  const rng=parseRange(e.r);
  const done=(sets||[]).filter(s=>s&&s.done&&num(s.kg)>0&&num(s.reps)>0);
  if(!done.length) return null;
  const maxKg=Math.max(...done.map(s=>num(s.kg)));
  const topSets=done.filter(s=>num(s.kg)===maxKg);
  const minRepsTop = Math.min(...topSets.map(s=>num(s.reps)));
  const baseInc = e.t==='comp' ? (maxKg>=40?5:2.5) : (maxKg>=20?2.5:1);
  const step = loadStepFor(id, e);
  const inc = step ? Math.max(step, Math.round(baseInc/step)*step) : baseInc;
  if(minRepsTop >= rng.max){
    return {kg:maxKg+inc, reps:rng.min, why:"bateu o topo · sobe carga", de:maxKg, inc};
  }
  if(minRepsTop >= rng.min){
    return {kg:maxKg, reps:minRepsTop+1, why:"mesma carga · +1 rep", de:maxKg, inc};
  }
  return {kg:maxKg, reps:rng.min, why:"foca em chegar no mínimo", de:maxKg, inc};
}
/* Sessão âncora da próxima meta: quase sempre a última, mas não quando a última foi leve
   (semana de deload, dia cortado). Ancorar ali faz o app prescrever a carga do deload na
   volta. Detecta pelo número de séries feitas, sem depender do deload estar marcado. */
function refSession(id){
  const h=(progressSessions(id)||[]).filter(s=>sessionTop(s.sets) && s.date!==today());
  if(!h.length) return null;
  const ult=h.slice(-4);
  const cont=ult.map(s=>(s.sets||[]).filter(x=>x&&x.done&&num(x.reps)>0).length);
  const tipico=Math.max(...cont);
  if(ult.length>1 && cont[cont.length-1] < tipico*0.6) return ult[ult.length-2];
  return ult[ult.length-1];
}
function suggestNext(id, e){
  if(!e) return null;
  const ref=refSession(id);
  if(!ref) return null;
  return suggestFrom(ref.sets, e, id);
}
/* "Top set" da sessão: maior carga e, entre as séries nessa carga, a melhor rep.
   Mede progresso do MESMO jeito que suggestNext prescreve (dupla progressão). Necessário
   porque o e1RM capa reps em 12 (Brzycki): nas faixas 12-20 (todas as elevações laterais,
   panturrilha, crucifixo inverso) subir 13→15→17 reps dá e1RM idêntico, e a detecção
   antiga acusava "plateau" e sugeria trocar o exercício enquanto o usuário progredia. */
function sessionTop(sets){
  const valid=(sets||[]).filter(s=>s&&num(s.kg)>0&&num(s.reps)>0);
  if(!valid.length) return null;
  const kg=Math.max(...valid.map(s=>num(s.kg)));
  const reps=Math.max(...valid.filter(s=>num(s.kg)===kg).map(s=>num(s.reps)));
  return {kg, reps};
}
// >0 se A progrediu em relação a B (mais carga, ou mesma carga com mais reps)
function cmpTop(a,b){
  if(!a||!b) return 0;
  if(a.kg!==b.kg) return a.kg>b.kg?1:-1;
  if(a.reps!==b.reps) return a.reps>b.reps?1:-1;
  return 0;
}
// Plateau: 3 últimas sessões VÁLIDAS sem progredir (nem carga, nem reps na mesma carga)
function detectPlateau(id){
  const h=progressSessions(id).filter(s=>sessionTop(s.sets));
  if(h.length<3) return false;
  const t=h.slice(-3).map(s=>sessionTop(s.sets));
  return cmpTop(t[2],t[0])<=0 && cmpTop(t[2],t[1])<=0;
}
// Quantas semanas o usuário tem treinado esse exercício específico (reinicia após troca marcada)
function weeksOnExercise(id){
  const h=progressSessions(id).filter(s=>hasValidDone(s.sets));
  if(!h.length) return 0;
  return Math.floor(daysBetween(h[0].date, today())/7)+1;
}
/* Trocar exercício é o ÚLTIMO recurso, não o primeiro.
   A evidência citada nos próprios princípios argumenta contra variar por variar: Fonseca et
   al 2014 (hipertrofia regional, mas perde força) e Baz-Valle et al 2019 (variação não supera
   exercício fixo em hipertrofia total). A alavanca com melhor suporte é volume e recuperação
   (Schoenfeld, Ogborn & Krieger 2017). Por isso caiu o gatilho "12 semanas no mesmo
   exercício": ficava aceso por meses e virava ruído. Só sugere depois de deload feito. */
function shouldSwapExercise(id){
  if(swapSnoozed(id)) return null;              // usuário escolheu manter este exercício
  if(!detectPlateau(id)) return null;
  const lastDeload = ST.meta.lastDeloadWeek||0;
  if(lastDeload>0 && weeksOnExercise(id)>=6) return "plateau-pos-deload";
  return null;
}

/* ============ ESTADO DE PROGRESSÃO (um estado, uma mensagem, uma ação) ============
   Substitui os três banners independentes que podiam aparecer juntos e se contradizer
   ("bateu o topo, sobe carga" + "plateau" + "considere trocar" na mesma tela). Nada é
   gravado: o que o app aconselhou é recalculado a partir da sessão anterior. */
function sessionRIR(sets){
  const v=(sets||[]).filter(s=>s&&s.done&&String(s.rir==null?'':s.rir).trim()!=='').map(s=>num(s.rir));
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
/* Tendência do peso em kg/semana (negativo = perdendo). Compara a média das primeiras
   pesagens da janela com a das últimas: ponto isolado engana (água, glicogênio, comida). */
function bwTrend(days){
  days=days||28;
  const t=today();
  const win=(ST.bw||[]).filter(b=>b&&b.date&&num(b.kg)>0 && daysBetween(b.date,t)>=0 && daysBetween(b.date,t)<days);
  if(win.length<4) return null;
  win.sort((a,b)=> a.date<b.date ? -1 : 1);
  const n=Math.max(2, Math.round(win.length/3));
  const avg=arr=>arr.reduce((a,b)=>a+num(b.kg),0)/arr.length;
  /* O divisor tem que ser a distância entre os CENTROS dos dois grupos, não o período
     inteiro da janela: os grupos são médias, e o centro de cada um cai pra dentro das
     pontas. Dividir pelo span total subestimava o ritmo em ~33% (4 pesagens semanais
     subindo 0,36kg/sem viravam 0,24). Mesmo bug corrigido no app dela em 2026-08-19.01. */
  const dia=b=>daysBetween(win[0].date, b.date);
  const avgDia=arr=>arr.reduce((a,b)=>a+dia(b),0)/arr.length;
  const semanas=Math.max(0.5, (avgDia(win.slice(-n)) - avgDia(win.slice(0,n)))/7);
  return (avg(win.slice(-n)) - avg(win.slice(0,n))) / semanas;
}
/* RITMO DE GANHO — portado do app dela, com a faixa invertida (lá é perda de gordura).
   O card de peso mostrava só "delta desde a primeira pesagem", que só cresce e nunca
   responde a pergunta que importa num superávit: estou ganhando no ritmo certo?
   Faixa-alvo 0,25-0,5% do peso por semana: acima disso o excedente vira gordura sem
   acelerar músculo (Garthe et al 2013). Precisa de 4+ pesagens em 28 dias. */
function bwRateInfo(){
  const kgSem = bwTrend(28);
  if(kgSem===null) return null;
  const ref = (ST.bw && ST.bw.length) ? num(ST.bw[ST.bw.length-1].kg) : 0;
  if(!(ref>0)) return null;
  const pct=(kgSem/ref)*100;          // positivo = ganhando
  let k, txt;
  if(pct>=0.25 && pct<=0.5)  { k='ok';   txt='no alvo'; }
  else if(pct>0.5)           { k='fast'; txt='rápido — o excedente vira gordura'; }
  else if(pct>0.05)          { k='slow'; txt='devagar pro alvo'; }
  else if(pct>=-0.15)        { k='flat'; txt='parado — não está em superávit'; }
  else                       { k='down'; txt='caindo'; }
  return {kgSem, pct, k, txt};
}
function fmtStep(v){ return (Math.round(v*10)/10).toString().replace('.',','); }
function progressState(id, e){
  if(!e) return null;
  const sug=suggestNext(id, e);
  const h=progressSessions(id).filter(s=>sessionTop(s.sets));
  if(h.length<2) return {k:'inicio', sug, msg:'', nota:'Duas sessões registradas e eu já começo a sugerir carga.'};
  const rng=parseRange(e.r);
  const tops=h.map(s=>sessionTop(s.sets));
  const cur=tops[tops.length-1], prev=tops[tops.length-2];
  // Carga nova e ainda abaixo do mínimo da faixa: é o esperado na dupla progressão.
  if(cur.kg>prev.kg && cur.reps<rng.min)
    return {k:'tentando', sug, msg:'', nota:`Carga nova. O trabalho agora é chegar em ${rng.min} reps antes de subir de novo.`};
  /* PRESO ABAIXO DO PISO DA FAIXA = a carga está alta demais pro que o exercício pede.
     Antes isso caía no ramo genérico do suggestFrom ("foca em chegar no mínimo") e o app
     repetia a MESMA carga indefinidamente: quem não fecha 15 reps com 15kg há um mês
     continuava vendo "15kg × 15" pra sempre, sem nunca ser mandado descer.
     NÃO dá pra usar o contador `travadas` aqui: com as reps oscilando 12→13→12→14, o topo
     sobe de vez em quando e `travadas` zera, então o app via "progredindo" enquanto a pessoa
     estava parada abaixo do piso há semanas. O sinal certo é ficar ABAIXO do piso na mesma
     carga, sessão após sessão, independente do vaivém de 1 rep. */
  let abaixo=0;
  for(let i=tops.length-1;i>=0;i--){
    if(tops[i].reps < rng.min && tops[i].kg >= cur.kg) abaixo++; else break;
  }
  if(abaixo>=3){
    const step=loadStepFor(id, e) || 0;
    const novo = step ? Math.max(step, cur.kg-step) : Math.round(cur.kg*0.9*2)/2;
    const pct = cur.kg ? Math.round((cur.kg-novo)/cur.kg*100) : 0;
    return {k:'carga-alta',
      sug:{kg:novo, reps:rng.min, why:'desce a carga pra entrar na faixa', de:cur.kg, inc:step},
      msg:`${abaixo} sessões sem fechar ${rng.min} reps com ${fmtKg(cur.kg)}kg (última: ${cur.reps}).`,
      nota:`A faixa ${e.r} faz parte da prescrição: se a carga não deixa chegar no piso dela, está acima do que o exercício pede — e num isolador isso vira impulso e trapézio em vez do músculo-alvo. Desce pra ${fmtKg(novo)}kg (${pct}% menos), fecha ${rng.min}-${rng.max} com controle, e sobe de novo a partir dali.`};
  }
  let travadas=0;
  for(let i=tops.length-1;i>0;i--){ if(cmpTop(tops[i],tops[i-1])<=0) travadas++; else break; }
  if(travadas<2) return {k:'progredindo', sug, msg:''};   // 1 sessão parada é ruído normal
  const nSess=()=>`${travadas} ${travadas===1?'sessão':'sessões'}`;
  // RIR: o sinal de fadiga que o app coletava em toda série e nunca lia
  const rirs=h.slice(-Math.min(travadas,3)).map(s=>sessionRIR(s.sets)).filter(v=>v!=null);
  const rirMed=rirs.length ? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  if(travadas>=3 && rirMed!=null && rirMed<=1)
    return {k:'fadiga', sug, acao:'deload',
      msg:`${nSess()} sem subir, todas perto da falha (RIR ${fmtStep(rirMed)}). Isso é fadiga acumulada, não falta de esforço.`,
      nota:'Faça uma semana leve: metade das séries, ou 20% menos carga. Depois volta.'};
  // No topo da faixa sem conseguir subir: o problema costuma ser o TAMANHO do salto
  if(cur.reps>=rng.max && travadas>=2){
    const step=loadStepFor(id, e) || (sug && sug.inc) || 0;
    const pct=step && cur.kg ? Math.round(step/cur.kg*100) : 0;
    return {k:'travado-passo', sug,
      msg:`${nSess()} no topo da faixa (${cur.reps} reps) sem subir a carga.`,
      nota: step
        ? `O menor salto que esse equipamento tem é ${fmtStep(step)}kg (${pct}% a mais). Duas saídas boas: sobe pra ${fmtKg(cur.kg+step)}kg e aceita cair pra ${rng.min} reps, ou mantém ${fmtKg(cur.kg)}kg e acrescenta 1 série.`
        : `Sobe pro próximo peso disponível e aceita cair pra ${rng.min} reps, ou mantém a carga e acrescenta 1 série.`};
  }
  // Carga parada com peso caindo é massa magra preservada, não fracasso (Helms 2014)
  const tend=bwTrend(28);
  if(travadas>=3 && tend!=null && tend<=-0.15)
    return {k:'mantendo', sug,
      msg:`Carga mantida e peso caindo ${fmtStep(Math.abs(tend))}kg por semana.`,
      nota:'Segurar a carga enquanto o peso cai é massa magra preservada. Não precisa mudar nada.'};
  if(shouldSwapExercise(id))
    return {k:'trocar', sug, acao:'trocar',
      msg:`Travado há ${nSess()} mesmo depois do deload, ${weeksOnExercise(id)} semanas nesse exercício.`,
      nota:'Agora sim vale testar uma variação.'};
  return {k:'travado', sug,
    msg:`${nSess()} sem progredir.`,
    nota:'Antes de mudar o treino: confere o sono e a comida da semana. É o que trava progresso com mais frequência.'};
}

/* ============ VOLUME SEMANAL (últimos 7 dias) ============ */
function weeklyVolume(){
  const out={};
  for(const mg of Object.keys(MG_LABELS)) out[mg]=0;
  const t=today();
  // 1) Programa ABCD (logs)
  for(const id of Object.keys(ST.logs)){
    const [day,idx]=id.split("_");
    const ex=WK[day]?.ex[+idx]; if(!ex||!ex.mg) continue;
    for(const sess of ST.logs[id]){
      const dd = daysBetween(sess.date, t);
      if(dd<0 || dd>=7) continue;
      const doneCount = validDoneCount(sess.sets);
      if(!doneCount) continue;
      for(const [mg,w] of Object.entries(ex.mg)){
        out[mg] = (out[mg]||0) + doneCount * w;
      }
    }
  }
  // 2) Sessões em casa (freelog) — calistenia conta sets done mesmo sem kg
  for(const id of Object.keys(ST.freelog)){
    const parts=id.split("_");
    const exIdx=+parts.slice(-1)[0];
    const templateId=parts.slice(0,-1).join("_");
    const tmpl=HOME_SESSIONS[templateId];
    const ex=tmpl?.ex[exIdx]; if(!ex||!ex.mg) continue;
    for(const sess of (ST.freelog[id]||[])){
      const dd = daysBetween(sess.date, t);
      if(dd<0 || dd>=7) continue;
      // Set válido na casa: done + reps>0 (kg pode ser 0 pra calistenia)
      const doneCount = (sess.sets||[]).filter(s=>s&&s.done&&num(s.reps)>0).length;
      if(!doneCount) continue;
      for(const [mg,w] of Object.entries(ex.mg)){
        out[mg] = (out[mg]||0) + doneCount * w;
      }
    }
  }
  return out;
}

    for(const ex of WK[d].ex){
      if(!ex.mg) continue;
      for(const [mg,w] of Object.entries(ex.mg)){
        out[mg] = (out[mg]||0) + (ex.s||0) * w;
      }
    }
  }
  return out;
}

/* ============ STREAK, SEMANA, DELOAD ============ */
function workoutDates(){
  const set=new Set();
  for(const id of Object.keys(ST.logs)){
    for(const sess of ST.logs[id]){
      if(hasValidDone(sess.sets)) set.add(sess.date);
    }
  }
  return Array.from(set).sort();
}
// Datas com QUALQUER atividade (programa OU sessão livre). Não zera streak em dia de casa.
function activityDates(){
  const set=new Set(workoutDates());
  for(const d of freeWorkoutDates()) set.add(d);
  return Array.from(set).sort();
}
function getStreak(){ // dias consecutivos com QUALQUER atividade (ABCD ou casa). Tolera só hoje em branco.
  const dates=new Set(activityDates());
  if(!dates.size) return 0;
  let streak=0, t=today();
  // se hoje não tem atividade, começa de ontem
  if(!dates.has(t)) t = dateAdd(t,-1);
  while(dates.has(t)){ streak++; t = dateAdd(t,-1); }
  return streak;
}
function weeksTraining(){
  const ds=workoutDates(); if(!ds.length) return 0;
  return Math.floor(daysBetween(ds[0], today())/7)+1;
}
function workoutsThisWeek(){ // só ABCD conta pra meta 4/4 — pra não inflar com sessões de casa
  const t=today(); let n=0;
  for(const d of workoutDates()){
    if(daysBetween(d,t)<7) n++;
  }
  return n;
}
// Streak semanal (Hevy model): semanas consecutivas com ≥3 treinos ABCD (3 dá pra falhar 1 e ainda contar).
// Janela semanal = últimos 7 dias até cada referência. Conta pra trás em saltos de 7.
function weekStreak(){
  const ds=workoutDates(); if(!ds.length) return 0;
  // base: fim de hoje
  let cursor=today();
  let streak=0;
  // Tolera semana atual com <3 se ainda não terminou (mantém streak até a semana acabar)
  const set=new Set(ds);
  const countWeekEnding=(endDate)=>{
    let n=0;
    for(let k=0;k<7;k++){
      if(set.has(dateAdd(endDate, -k))) n++;
    }
    return n;
  };
  // Se semana corrente tem <3 mas tem ≥1, conta a semana ANTERIOR como base
  const curN=countWeekEnding(cursor);
  if(curN>=3){
    streak=1; cursor=dateAdd(cursor,-7);
  } else if(curN>=1){
    // semana corrente em andamento: olha pra anterior
    cursor=dateAdd(cursor,-7);
  } else {
    return 0;
  }
  while(countWeekEnding(cursor)>=3){
    streak++; cursor=dateAdd(cursor,-7);
  }
  return streak;
}
/* Séries válidas numa janela de 7 dias terminando em `fim` (ISO). */
function setsInWeekEnding(fim){
  let n=0;
  for(const id of Object.keys(ST.logs||{})){
    for(const sess of (ST.logs[id]||[])){
      const dd=daysBetween(sess.date, fim);
      if(dd>=0 && dd<7) n+=(sess.sets||[]).filter(s=>s&&s.done&&num(s.kg)>0&&num(s.reps)>0).length;
    }
  }
  return n;
}
/* Deload detectado pelos DADOS, não por botão. A semana leve é o que você FAZ, não o que
   declara. Janela móvel de 7 dias vs as 4 anteriores: como todas são múltiplas de 7 dias,
   caem no mesmo dia da semana e a comparação é alinhada por construção. Sem isto o alerta
   vermelho fica aceso pra sempre até alguém tocar em "Feito", e alerta permanente é alerta
   invisível. Idempotente: no máximo uma marcação por semana. */
function autoDetectDeload(){
  const semAtual=weeksTraining();
  if(semAtual<4) return;
  if((ST.meta.lastDeloadWeek||0) >= semAtual-1) return;
  const atual=setsInWeekEnding(today());
  const refs=[];
  for(let k=1;k<=4;k++) refs.push(setsInWeekEnding(dateAdd(today(), -7*k)));
  const treinadas=refs.filter(v=>v>0);
  if(treinadas.length<2) return;
  const media=treinadas.reduce((a,b)=>a+b,0)/treinadas.length;
  if(media<=0) return;
  if(atual <= media*0.6){
    ST.meta.lastDeloadWeek=Math.max(1, semAtual-1);
    ST.meta.lastDeloadAuto=true;
    saveK('meta');
  }
}
/* ============ SESSÃO CURTA — "hoje só tenho X min" ============
   Mesmo padrão do "dia de mais cardio" do app dela: o usuário sinaliza a restrição e o app
   decide o que sai. A diferença é que aqui existe histórico REAL de duração
   (ST.session.history.activeMs), então a estimativa é calibrada no ritmo dele em vez de
   confiar num modelo genérico. */

// Minutos estimados de um exercício: execução + descanso por série (+ aquecimento nos compostos).
// Unilateral ("por lado") conta dobrado — são duas execuções por série registrada.
const EXEC_SEC = {comp:45, iso:35, core:40};
function exMinutes(e){
  if(!e) return 0;
  const sets = exSets(e) * (/por lado/i.test(String(e.r||'')) ? 2 : 1);
  const exec = EXEC_SEC[e.t] ?? 35;
  const rest = REST[e.t] ?? 90;
  const warm = e.t==='comp' ? 2*(25+45) : 0;     // 2 séries de aquecimento
  return (sets*(exec+rest) + warm)/60;
}
// Fator que aproxima o modelo do tempo que ELE de fato leva neste treino (mediana do histórico).
// Sem histórico suficiente, fica 1 (modelo puro). Limitado pra um outlier não distorcer tudo.
function paceFactor(d){
  const h=sessionsForDay(d).filter(r=>r && r.activeMs>0);
  if(h.length<2) return 1;
  const mins=h.slice(0,6).map(r=>r.activeMs/60000).sort((a,b)=>a-b);
  const real=mins[Math.floor(mins.length/2)];
  const modelo=(WK[d]?WK[d].ex:[]).reduce((a,e)=>a+exMinutes(e),0);
  if(!(modelo>0) || !(real>0)) return 1;
  return Math.min(1.8, Math.max(0.6, real/modelo));
}
function dayEstMin(d){
  const f=paceFactor(d);
  return Math.round((WK[d]?WK[d].ex:[]).reduce((a,e)=>a+exMinutes(e),0)*f);
}

/* Quanto vale manter cada exercício hoje. Ordem de decisão:
   (1) o que o corpo ainda NÃO recebeu esta semana (weeklyVolume vs MG_TARGETS),
   (2) o TIER do músculo (1 peito > 2 braços > 3 largura > 4 manutenção),
   (3) composto pesa mais que isolador, core pesa menos. */
function exValue(e){
  const vol=weeklyVolume();
  let sc=0;
  for(const [mg,w] of Object.entries(e.mg||{})){
    const meta=MG_TARGETS[mg]||0, feito=vol[mg]||0;
    const falta = meta>0 ? Math.max(0, Math.min(1,(meta-feito)/meta)) : 0.5;
    sc += w*(falta*2 + tierWeight(mg));
  }
  if(e.t==='comp') sc+=1;
  if(e.t==='core') sc-=0.3;
  return sc;
}
/* Plano da sessão curta. Protege, nesta ordem:
   - o PRIMEIRO exercício do dia (é o principal, e exercício no começo rende mais — Simão 2012);
   - pelo menos UM exercício de cada músculo prioritário presente no dia (senão o corte apagaria
     justamente o objetivo — manter estímulo na prioridade importa mais que espalhar o corte,
     porque manter músculo exige bem menos volume que construir, Bickel 2011);
   - um piso de 3 exercícios: abaixo disso não é treino, é passagem pela academia. */
function shortPlan(d, alvoMin){
  const ex=(WK[d]?WK[d].ex:[]);
  const f=paceFactor(d);
  const min=ex.map(e=>exMinutes(e)*f);
  const total=min.reduce((a,b)=>a+b,0);
  const fora=new Set();
  if(!(alvoMin>0) || total<=alvoMin) return {fora, estMin:Math.round(total), total:Math.round(total), coube:true};

  // um guardião por músculo prioritário presente hoje: o de maior valor
  const guard=new Set([0]);
  for(const mg of Object.keys(BLOCOS[blocoAtual()].tier).filter(m=>tierOf(m)<=2)){   // guarda o foco do bloco
    let melhor=-1, best=-Infinity;
    ex.forEach((e,i)=>{ if((e.mg||{})[mg]>=1){ const v=exValue(e); if(v>best){best=v; melhor=i;} } });
    if(melhor>=0) guard.add(melhor);
  }
  const cand=ex.map((e,i)=>i).filter(i=>!guard.has(i)).sort((a,b)=> exValue(ex[a])-exValue(ex[b]) || b-a);
  const maxFora=Math.max(0, ex.length-3);
  let atual=total;
  for(const i of cand){
    if(atual<=alvoMin || fora.size>=maxFora) break;
    fora.add(i); atual-=min[i];
  }
  return {fora, estMin:Math.round(atual), total:Math.round(total), coube:atual<=alvoMin};
}

// Marcação por data (só hoje), expira em 30 dias, entra no backup junto com ST.meta.
function shortDayMin(d){
  const m=(ST.meta && ST.meta.shortDays) || {};
  const r=m[today()];
  return (r && r.d===d) ? r.min : 0;
}
function setShortDay(d, min){
  if(!ST.meta || typeof ST.meta!=='object') ST.meta={};
  ST.meta.shortDays=ST.meta.shortDays||{};
  const t=today();
  if(!min) delete ST.meta.shortDays[t];
  else ST.meta.shortDays[t]={d, min};
  for(const k of Object.keys(ST.meta.shortDays)){
    if(daysBetween(k,t)>30 || daysBetween(k,t)<-1) delete ST.meta.shortDays[k];
  }
  saveK('meta'); render();
}

/* ============ CURVA DE PROGRESSO POR EXERCÍCIO ============
   Havia lista de PRs, mas nenhuma curva: dava pra saber o melhor, não o caminho.

   Por que NÃO uso o e1RM daqui: o Brzycki que o app usa pros PRs capa as reps em 12
   (proposital — é conservador pra reivindicar recorde). Nas faixas 12-20, que hoje são a
   maioria do programa, subir 13→15→17 reps dá e1RM idêntico e a curva sairia reta.
   E um produto simples (kg × reps) inverte na dupla progressão: 15kg×20 = 300 cai pra
   17,5kg×12 = 210, mostrando queda justo quando ele progrediu de carga.
   Epley (kg × (1 + reps/30)) sem capa é o melhor dos três: sobe quando a carga sobe E
   quando as reps sobem, e não quebra em rep alta.
   LIMITE CONHECIDO: no salto de carga com queda grande de reps (15kg×20 → 17,5kg×12) ele
   ainda marca ~2% de queda — os dois sets são praticamente equivalentes em qualquer fórmula
   de 1RM, então isso é ambiguidade real, não bug. Contra os 30% de queda que o produto
   kg×reps daria no mesmo caso, é ruído. A curva se recupera nas sessões seguintes.
   Fica SÓ para o gráfico — PR e plateau continuam no Brzycki, pra não haver dois números
   concorrentes de "recorde". */
function progressoScore(sets){
  const t=sessionTop(sets);
  return t ? t.kg*(1+t.reps/30) : 0;
}
function curvaProgresso(id, max){
  return progressSessions(id)
    .filter(s=>sessionTop(s.sets))
    .slice(-(max||10))
    .map(s=>({date:s.date, val:progressoScore(s.sets)}));
}

/* ============ ÍNDICE DE FADIGA ============
   O RIR era gravado em toda série e só era lido pra diagnosticar UM exercício por vez.
   E o deload era por calendário — não sabia se você estava fadigado. Aqui o sinal é
   coletivo: quantos exercícios do programa estão travados AO MESMO TEMPO e com que RIR.
   Fadiga acumulada aparece como "vários travando junto, todos perto da falha", não como
   "passaram 5 semanas". */
function fadigaGlobal(){
  let travados=0, comHist=0; const rirs=[];
  for(const d of ['A','B','C','D']){
    const ex=(WK[d]&&WK[d].ex)||[];
    ex.forEach((e,i)=>{
      if(e.t==='core') return;                       // core não é sinal de fadiga sistêmica
      const h=progressSessions(exId(d,i)).filter(x=>sessionTop(x.sets));
      if(h.length<3) return;
      comHist++;
      const t=h.slice(-3).map(x=>sessionTop(x.sets));
      if(cmpTop(t[2],t[1])<=0 && cmpTop(t[2],t[0])<=0) travados++;
      const r=sessionRIR(h[h.length-1].sets); if(r!=null) rirs.push(r);
    });
  }
  if(comHist<4) return null;                         // dado insuficiente: não inventa diagnóstico
  const pct=travados/comHist;
  const rirMed=rirs.length ? rirs.reduce((a,b)=>a+b,0)/rirs.length : null;
  /* Com recuperação subjetiva ruim, menos exercícios travados já bastam: o sinal objetivo
     (travar) e o subjetivo (chegar pesado) apontando junto é evidência mais forte que
     qualquer um sozinho. */
  const limiar = recuperacaoRuim() ? 0.35 : 0.5;
  return {travados, comHist, pct, rirMed, recRuim:recuperacaoRuim(),
          alta: pct>=limiar && (rirMed==null || rirMed<=1.5)};
}
/* Deload deixou de ser calendário: a semana 4 de cada mesociclo já é leve por construção
   (ver exSets). Isto aqui é só o gatilho de ANTECIPAR quando a fadiga chega antes. */
function needsDeload(){
  if(emDeload()) return null;
  if(mesoSemana()>=4) return null;
  const f=fadigaGlobal();
  if(f && f.alta) return f;
  return null;
}
/* O deload agora ACONTECE POR DESENHO (semana 4 do mesociclo ou antecipado por fadiga), não
   por detecção. Mas `lastDeloadWeek` só era gravado pelo autoDetectDeload, que exige o volume
   cair a <=60% da média — e o corte do mesociclo dá 61% (dela) / 56% (dele). Resultado: o
   marcador podia nunca ser gravado, e como `shouldSwapExercise` exige deload feito, a sugestão
   de trocar exercício nunca disparava. Aqui a semana leve se registra sozinha. */
function registrarDeloadEmCurso(){
  try{
    if(!emDeload()) return;
    if(!ST.meta || typeof ST.meta!=='object') ST.meta={};
    const sem=weeksTraining();
    if(sem>0 && (ST.meta.lastDeloadWeek||0) < sem){ ST.meta.lastDeloadWeek=sem; saveK('meta'); }
  }catch(e){}
}
function markDeloadDone(){ ST.meta.lastDeloadWeek = weeksTraining(); ST.meta.deloadAte=null; saveK('meta'); }
// Próximo treino sugerido baseado no último feito (ciclo ABCD)
function suggestedNextDay(){
  const seq=["A","B","C","D"];
  let lastDay=null, lastDate="0000-00-00";
  for(const id of Object.keys(ST.logs)){
    const day=id.split("_")[0];
    for(const sess of ST.logs[id]){
      if(hasValidDone(sess.sets) && sess.date>lastDate){
        lastDate=sess.date; lastDay=day;
      }
    }
  }
  if(!lastDay) return "A";
  const idx=seq.indexOf(lastDay);
  return seq[(idx+1)%4];
}

/* ============ HISTÓRICO DE SESSÕES (ST.session.history — ABCD, com duração) ============ */
// Duração compacta pra listas: "52min", "1h08".
function fmtDurMin(ms){
  const min=Math.round((ms||0)/60000);
  if(min<60) return min+'min';
  const h=Math.floor(min/60), m=min%60;
  return m ? `${h}h${String(m).padStart(2,'0')}` : `${h}h`;
}
// Sessões concluídas de um treino ABCD, mais recentes primeiro.
function sessionsForDay(day){
  return ST.session.history.filter(h=>h.workoutId===day)
    .slice().sort((a,b)=>(b.endAt||0)-(a.endAt||0));
}
// Quais dias ABCD tiveram sets válidos HOJE (mesmo sem ter concluído/celebrado).
function todayTrainedDays(){
  const t=today(); const set=new Set();
  for(const id of Object.keys(ST.logs)){
    const day=id.split('_')[0];
    if(!(day==='A'||day==='B'||day==='C'||day==='D')) continue;
    for(const s of ST.logs[id]){ if(s.date===t && hasValidDone(s.sets)){ set.add(day); break; } }
  }
  return Array.from(set);
}
// Último treino ABCD CONCLUÍDO hoje (registro tem duração). null se nenhum finalizado.
function todaySessionRecord(){
  const t=today();
  const recs=ST.session.history.filter(h=>h.date===t);
  return recs.length ? recs[recs.length-1] : null;
}

/* ============ NAV ============ */
let tab="treino", openDay=null, openHomeDay=null;
function setTab(t){
  tab=t; openDay=null; openHomeDay=null;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  render(); window.scrollTo(0,0);

function openHome(id){ openHomeDay=id; openDay=null; tab="treino"; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==="treino")); render(); window.scrollTo(0,0); }
function backToList(){ openDay=null; openHomeDay=null; render(); window.scrollTo(0,0); }

/* ============ RENDER ============ */
const app=document.getElementById('app');

function render(){
  if(tab==="treino"){
    if(openHomeDay) return renderHomeDay(openHomeDay);
    return openDay? renderDay(openDay) : renderDays();
  }
  if(tab==="hoje") return renderHoje();
  if(tab==="corpo") return renderCorpo();
  if(tab==="mais") return renderMais();
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtKg(v){ const n=num(v); return n? (Math.round(n*10)/10).toString() : '–'; }
function fmtInt(v){ const n=parseInt(v); return isFinite(n)?String(n):'–'; }
// Helper: set é "válido feito" se done + kg + reps preenchidos
function isValidDone(s){ return !!(s && s.done && num(s.kg)>0 && num(s.reps)>0); }
function validDoneCount(sets){ return (sets||[]).filter(isValidDone).length; }
function hasValidDone(sets){ return (sets||[]).some(isValidDone); }

/* ============ TREINOS — lista A/B/C/D ============ */
function renderDays(){
  sub.textContent="Toque num treino para começar";
  const sug=suggestedNextDay();

  const deload=needsDeload();

    ${(()=>{ const f=faseMeso();

        return (par.length ? `<div class="bl-rev">
          <div class="bl-rev-h">${I.trend} ${par.length} acessório${par.length>1?'s':''} sem progredir neste bloco — hora natural de rotacionar</div>
          ${par.map(x=>`<div class="bl-rev-i"><b>${esc(x.nome)}</b> <small>${x.dia} · ${x.sess} sessões</small>${x.alts.length?`<span>${x.alts.map(a=>esc(a)).join(' · ')}</span>`:''}</div>`).join('')}
          <div class="bl-rev-f">Abra o exercício e use "Troquei" pra reiniciar a progressão sem perder histórico. Prefira a versão mais alongada (Wolf et al 2023).</div>
        </div>` : '') +
        `<button class="bl-btn" onclick="trocarBloco()">Bloco cumprido — virar pro de ${esc(blocoAtual()==='peito_bracos'?BLOCOS.perna.nome:BLOCOS.peito_bracos.nome)}</button>`; })()
             : `<button class="bl-btn ghost" onclick="trocarBloco()">Virar agora</button>`}
  </div>`;
  h+=`<div class="stats">
    <div class="stat streak"><div class="l"><span style="display:inline-flex;vertical-align:-3px;margin-right:4px">${I.flame}</span>Semanas seguidas</div><div class="v">${weekN}<small> sem</small></div><div class="s">${weekN>0?'≥3 treinos/sem':'comece esta semana'}</div></div>
    <div class="stat"><div class="l">Esta semana</div><div class="v">${wkN}<small>/4</small></div><div class="s">treinos completados</div></div>
  </div>`;
  const trained = new Set(todayTrainedDays());
  const doneToday = trained.size>0;
  const todayRec = todaySessionRecord();
  // Cabeçalho: se já treinou hoje, celebra o feito e aponta o próximo como próximo (não "hoje").

    // Anel: verde no concluído; azul no sugerido só quando ainda não treinou hoje
    const ring = isDoneToday

      : (isNext && !doneToday ? 'box-shadow:0 0 0 2px rgba(91,158,255,.35), var(--shadow-1)' : '');
    const heroUrl = photoURL(w.ex[0].n);
    const bg = heroUrl ? `<img class="day-bg" src="${heroUrl}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : '';
    h+=`<div class="day ${w.type}" onclick="openWorkout('${d}')" style="${ring}">
