      <div class="meta">
        <div class="t">${w.name}${tag}</div>
        <div class="f">${w.focus}</div>
        <div class="cnt">${w.ex.length} EXERCÍCIOS</div>
      </div>
      <div class="chev">${I.chevR}</div>
    </div>`;
  }
  app.innerHTML=h;
}

/* ============ TREINO ABERTO — exercícios ============ */
function renderDay(d){
  const w=WK[d];
  sub.textContent=`${w.name} · ${w.focus}`;
  const sessActive = isSessionActive() && ST.session.active.workoutId===d;
  const sessChip = sessActive
    ? `<div class="session-chip ${isSessionPaused()?'paused':''}"><span class="label">${isSessionPaused()?'PAUSADO':'EM TREINO'}</span><span id="sessionElapsed">${fmtDuration(getSessionElapsed())}</span></div>`
    : `<div class="session-chip hidden"><span class="label">EM TREINO</span><span id="sessionElapsed">0:00</span></div>`;
  let h=`<div class="backbar"><button class="back" onclick="backToList()">${I.arrowL}<span>Treinos</span></button>${sessChip}</div>`;

  // Mini-histórico deste treino (últimas 4 vezes): data · duração · sets · volume
  const hist=sessionsForDay(d);
  if(hist.length){
    const rows=hist.slice(0,4).map(r=>{
      const vol=r.volume?` · ${r.volume>=1000?(r.volume/1000).toFixed(1)+'t':r.volume+'kg'}`:'';
      return `<div class="wkh-row"><span class="wkh-d">${esc(r.date.slice(5).replace('-','/'))}</span><span class="wkh-v">${fmtDurMin(r.activeMs)}</span><span class="wkh-s">${r.sets||0} sets${vol}</span></div>`;
    }).join('');
    h+=`<div class="wkhist">
      <div class="wkh-h">${I.hist} Histórico deste treino</div>
      ${rows}
    </div>`;
  }

  // Sessão curta: controle de tempo + plano do que sai hoje
  const capMin=shortDayMin(d);
  const plano=shortPlan(d, capMin);
  /* Rótulos honestos: com descanso de 2:30 nos compostos, 3 exercícios já custam ~40 min.
     Um botão "30 min" nunca entregaria 30 — então o mais curto se chama Essencial e a UI diz
     o número real que sobrou, em vez de prometer um alvo que o protocolo não permite. */
  const opcoes=[[0,'Completo'],[45,'45 min'],[25,'Essencial']].map(([mm,rot])=>
    `<button class="tc-opt ${mm===capMin?'on':''}" onclick="setShortDay('${d}',${mm})">${rot}</button>`).join('');
  const cortados=[...plano.fora].length;
  h+=`<div class="timecap">
    <div class="tc-hd">
      <span class="tc-l">Tempo hoje</span>
      <span class="tc-v">~${capMin?plano.estMin:plano.total} min${capMin?` <small>de ${plano.total}</small>`:''}</span>
    </div>
    <div class="tc-opts">${opcoes}</div>
    ${capMin ? `<div class="tc-note">${cortados? `${cortados} exercício${cortados>1?'s':''} marcado${cortados>1?'s':''} pra pular — ficou o que mais falta na semana e o que serve as prioridades. Continua registrável se sobrar tempo.` : 'Já cabe no tempo, não precisei cortar nada.'}${!plano.coube&&cortados?` <b>Piso de ~${plano.estMin} min</b>: cortar mais deixaria de ser treino, e encurtar descanso custaria estímulo.`:''}</div>` : ''}
  </div>`;

  w.ex.forEach((e,i)=>{
    const id=exId(d,i);
    const pular=plano.fora.has(i);
    const last=lastSession(id);
    const tod=todaySession(id);
    const pillT = e.t==="comp"?"composto":(e.t==="core"?"core":"isolador");
    const pillC = e.t==="comp"?"comp":(e.t==="core"?"core":"iso");
    const planned=exSets(e);
    // séries extras (drop set, série a mais) ficam salvas na própria sessão — o log cresce junto
    const nset=Math.max(planned, (tod&&tod.sets&&tod.sets.length)||0);
    const url=photoURL(e.n);                  // foto SEMPRE pela chave original (PHOTO_ID/PHOTO_LOCAL keyados por e.n)
    const nm=exName(e), cue=exCue(e), note=exNote(e);   // nome/cue/nota exibidos (override do usuário se houver)

    // último treino: mostra séries + e1RM melhor (valores sanitizados via fmtKg/fmtInt)
    let lastTxt;
    if(last){
      const sets = last.sets.map(s=>{
        const rir = (s.rir!=null && String(s.rir).trim()!=='') ? `@${fmtInt(s.rir)}` : '';
        return `<b>${fmtKg(s.kg)}×${fmtInt(s.reps)}${rir}</b>`;
      }).join(" · ");
      const e1=bestE1RM(last.sets);
      const e1Txt = e1>0?` · e1RM <b style="color:var(--core)">${(Math.round(e1*10)/10)}kg</b>`:'';
      lastTxt=`${I.hist} <span class="lastd">Última (${esc(last.date.slice(5))}):</span> ${sets}${e1Txt}`;
      if(last.cmt) lastTxt+=`<span class="lastcmt">“${esc(last.cmt)}”</span>`;
    } else {
      lastTxt=`${I.hist} Primeira vez — crie sua base. Comece leve e suba 1-2 séries.`;
    }
    const todCmt=(tod&&tod.cmt)||'';

    /* UM estado, UMA mensagem, UMA ação. Antes eram três banners independentes que podiam
       aparecer juntos dizendo coisas opostas na mesma tela. */
    const st = progressState(id, e);
    const sug = st && st.sug;
    const sugBlock = sug ? `<div class="suggest">${I.spark}<span>Meta: <span class="v">${fmtKg(sug.kg)}kg × ${sug.reps}</span></span><span class="why">${sug.why}</span></div>` : '';

    const swap = st && st.k==='trocar';
    const alts = EXERCISE_ALTERNATIVES[e.n] || [];
    let platBlock2 = '';
    if(swap){
      platBlock2 = `<div class="swap">
        <div class="swap-head">${I.trend} <b>${esc(st.msg)}</b></div>
        ${alts.length ? `<div class="swap-list">${alts.map(a=>`<div class="swap-alt">• ${esc(a)}</div>`).join('')}</div>` : ''}
        <div class="swap-foot">${esc(st.nota)} Prefira a versão mais alongada (Wolf et al 2023).</div>
        <div class="swap-acts">
          <button class="swap-btn" onclick="markExerciseSwapped('${id}')">Troquei — reiniciar progressão</button>
          <button class="swap-btn ghost" onclick="snoozeSwap('${id}')">Manter esse</button>
        </div>
      </div>`;
    } else if(st && st.k==='mantendo'){
      platBlock2 = `<div class="holding">${I.check2} ${esc(st.msg)}<span class="stnote">${esc(st.nota)}</span></div>`;
    } else if(st && (st.k==='fadiga' || st.k==='travado-passo' || st.k==='travado' || st.k==='carga-alta')){
      platBlock2 = `<div class="plateau">${I.flame} ${esc(st.msg)}<span class="stnote">${esc(st.nota)}</span></div>`;
    } else if(st && st.nota){
      platBlock2 = `<div class="suggest" style="opacity:.85"><span class="why" style="margin:0">${esc(st.nota)}</span></div>`;
    }

    // Banner "feito ontem em casa" — se sessão livre de ontem cobre esse exercício
    const yesterday = dateAdd(today(), -1);
    const yesterdayTemplates = homeTemplatesCompletedOn(yesterday);
    let skipBanner = '';
    for(const tid of yesterdayTemplates){
      const skipList = HOME_SESSIONS[tid]?.canSkipNextDay?.[d] || [];
      if(skipList.includes(e.n)){
        skipBanner = `<div class="home-done-banner"><span style="display:inline-flex;vertical-align:-2px;margin-right:5px;color:#a8e6a8">${I.check2}</span><b>${esc(HOME_SESSIONS[tid].name)} feito ontem em casa</b> · esse músculo já foi trabalhado — pode pular se preferir (ou fazer leve)</div>`;
        break;
      }
    }

    // PR badge (sessão de hoje)
    const todayPR = tod && isPRSession(id, tod.sets);

    let rows="";
    for(let k=0;k<nset;k++){
      const tv=tod&&tod.sets[k]?tod.sets[k]:{};
      const lv=last&&last.sets[k]?last.sets[k]:{};
      const isExtra = k>=planned;
      rows+=`<div class="setrow r4${isExtra?' extra':''}">
        <div class="sn">${k+1}</div>
        <input class="num" inputmode="decimal" placeholder="${lv.kg||'kg'}" value="${tv.kg||''}" data-id="${id}" data-k="${k}" data-f="kg" oninput="onLog(this)">
        <input class="num" inputmode="numeric" placeholder="${lv.reps||'reps'}" value="${tv.reps||''}" data-id="${id}" data-k="${k}" data-f="reps" oninput="onLog(this)">
        <input class="num rir" inputmode="numeric" placeholder="${lv.rir!=null&&lv.rir!==''?lv.rir:'RIR'}" value="${tv.rir!=null?tv.rir:''}" data-id="${id}" data-k="${k}" data-f="rir" oninput="onLog(this)" maxlength="1">
        <div class="chk ${tv.done?'on':''}" onclick="toggleDone('${id}',${k},this)">${I.check}</div>
        ${isExtra?`<button class="rmset" onclick="removeSet('${id}',${k})" title="Remover série extra" aria-label="Remover série extra">×</button>`:''}
      </div>`;
    }
    const yt=`https://www.youtube.com/results?search_query=`+encodeURIComponent(nm+" execução técnica academia");
    const restS=(REST[e.t] ?? 90);
    // warmup pro composto
    const warmup = e.t==='comp' && last && bestE1RM(last.sets)>0 ? (() => {
      const maxKg = Math.max(...last.sets.filter(s=>s&&num(s.kg)>0).map(s=>num(s.kg)));
      const w1=Math.round((maxKg*0.5)/2.5)*2.5;
      const w2=Math.round((maxKg*0.75)/2.5)*2.5;
      return `<div class="cue" style="margin-top:8px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px"><span style="display:inline-flex;color:#ffd178">${I.bolt}</span><span><b style="color:#fff">Aquecimento:</b> ${w1}kg × 8 · ${w2}kg × 5 (antes de começar)</span></div>`;
    })() : '';
    const photoBlock = url
      ? `<div class="photo semtarja">
           <img src="${url}" alt="${esc(nm)}" loading="lazy" decoding="async" onload="this.classList.add('loaded')" onerror="this.parentElement.classList.add('noimg'); this.remove();">
         </div>`
      : `<div class="photo noimg semtarja">
           <div class="ph-fallback">Sem foto disponível</div>
         </div>`;

    /* ORDEM DO CARD (2026-08-19.12): o que se usa DURANTE a série vem primeiro — nome, meta,
       campos. Foto, técnica, vídeo e editar são material de consulta e ficam num "Como fazer"
       recolhido. Antes a foto sozinha comia 370px antes de qualquer coisa acionável, e a Meta
       aparecia depois de 3 blocos de leitura: ~8 telas de rolagem por sessão, medidas. */
    const detAberto = exDetalhes.has(id);
    h+=`<div class="ex${pular?' skipped':''}">
      <div class="body">
        <div class="exhead">
          <div class="exname">${esc(nm)}</div>
          <div class="pill ${pillC}">${pillT}</div>
          ${todayPR?`<span class="pr-inline">${I.trophy.replace('width="18" height="18"','width="11" height="11"')} PR</span>`:''}
        </div>
        ${pular?`<div class="skiptag">${I.moon} Pular hoje · libera ~${Math.round(exMinutes(e)*paceFactor(d))} min</div>`:''}
        <div class="target">
          <span class="met"><b>${planned}</b> séries${nset>planned?` <span class="xtra">+${nset-planned} extra</span>`:''}</span>
          <span class="dot"></span>
          <span class="met"><b>${e.r}</b> reps</span>
          <span class="dot"></span>
          <span class="met"><b>${Math.floor(restS/60)}:${String(restS%60).padStart(2,'0')}</b> descanso</span>
        </div>
        ${skipBanner}
        ${sugBlock}
        ${platBlock2}
        ${warmup}
      </div>
      <div class="log">
        <div class="last">${lastTxt}</div>
        ${(()=>{ const c=curvaProgresso(id);
          if(c.length<3) return '';
          const d=c[c.length-1].val-c[0].val, pct=c[0].val>0?Math.round(d/c[0].val*100):0;
          const cor=d>=0?'var(--ok)':'var(--push)';
          return `<div class="curva">${miniSpark(c)}<span class="cv-t">${c.length} sessões<b style="color:${cor}">${d>=0?'+':''}${pct}%</b></span></div>`; })()}
        <div class="colhead r4"><span></span><span>kg</span><span>reps</span><span>RIR</span><span></span></div>
        ${rows}
        <button class="addset" onclick="addSet('${id}')">${I.plus}<span>Série extra${nset>planned?` · ${nset-planned} a mais`:''}</span></button>
        <div class="loghint"><span>RIR = reps em reserva (0-2 = ideal)</span><span class="saved" id="sv_${id}">${I.check2} salvo</span></div>
        <input class="logcmt" type="text" maxlength="200" placeholder="Comentário do dia (outra máquina, variação, dor...)" value="${esc(todCmt)}" data-cid="${id}" oninput="onComment(this)">
        ${(()=>{ const pc=commentsFor(id,'log'); return pc.length?`<details class="cmthist"><summary>${I.hist} Comentários anteriores (${pc.length})</summary>${pc.map(c=>`<div class="cmth-row"><span class="cmth-d">${esc(c.date.slice(5).replace('-','/'))}</span><span class="cmth-t">${esc(c.cmt)}</span></div>`).join('')}</details>`:''; })()}
      </div>
      <button class="restbig" onclick="openTimer(${restS})">${I.timer}<span>Descanso ${Math.floor(restS/60)}:${String(restS%60).padStart(2,'0')}</span></button>
      <button class="exmore${detAberto?' aberto':''}" onclick="toggleDetalhes('${id}')">
        ${I.play}<span>Como fazer</span><i>${detAberto?'▲':'▼'}</i>
      </button>
      ${detAberto?`<div class="exdet">
        ${photoBlock}
        ${cue&&cue!=="—"?`<div class="cue">${exOverride(e).cue?esc(cue):cue}</div>`:""}
        ${note&&note.trim()?`<div class="exnote">${I.pencil}<span>${esc(note)}</span></div>`:""}
        <div class="exbtns2">
          <a class="xb" href="${yt}" target="_blank" rel="noopener">${I.play}<span>Vídeo</span></a>
          <button class="xb" onclick="openExEdit('${e.id}')">${I.pencil}<span>Editar</span></button>
        </div>
      </div>`:''}
    </div>`;
  });
  // pergunta de recuperação: só depois do treino concluído, uma vez por dia
  if(isWorkoutComplete(d)) h+=recCard();
  app.innerHTML=h;
}

function collect(id){
  const inputs=document.querySelectorAll(`input[data-id="${id}"]`);
  const map={};
  inputs.forEach(inp=>{
    const k=inp.dataset.k;
    map[k]=map[k]||{};
    map[k][inp.dataset.f]= inp.value.trim();
  });
  const tod=todaySession(id);
  const sets=Object.keys(map).sort((a,b)=>a-b).map(k=>{
    const prev=tod&&tod.sets[k]?tod.sets[k]:{};
    return {kg:map[k].kg||"", reps:map[k].reps||"", rir:map[k].rir!==undefined?map[k].rir:(prev.rir||""), done:prev.done||false};
  });
  return sets;
}
let svTimer=null;
function flashSaved(id){
  const el=document.getElementById('sv_'+id); if(!el) return;
  el.classList.add('show'); clearTimeout(svTimer);
  svTimer=setTimeout(()=>el.classList.remove('show'),1200);
}
function onLog(inp){ const id=inp.dataset.id; upsertToday(id, collect(id)); flashSaved(id); }
/* Série extra além do planejado (drop set, série a mais). Fica salva na sessão do dia e
   conta no volume semanal como qualquer outra. collect() antes de anexar preserva o que já
   estava digitado e ainda não foi salvo. */
/* Remove uma série EXTRA (além do recomendado da fase). Antes só dava pra adicionar: um
   toque sem querer no "Série extra" ficava lá pra sempre, e não havia como distinguir o
   planejado da sobra. Confirma só quando a série já tem registro. */
function removeSet(id, k){
  const tod=todaySession(id);
  const stored=(tod&&Array.isArray(tod.sets))?tod.sets:[];
  const fromDom=collect(id);
  const sets = fromDom.length>=stored.length ? fromDom : stored.slice();
  if(k<0 || k>=sets.length) return;
  const st=sets[k]||{};
  const temDado = (String(st.kg||'').trim()!=='') || (String(st.reps||'').trim()!=='') || st.done;
  if(temDado && !confirm('Essa série tem registro. Remover mesmo assim?')) return;
  sets.splice(k,1);
  upsertToday(id, sets);
  render();
}
/* Abre o app no navegador pra forçar atualização. O service worker serve uma cópia offline,
   então o PWA instalado pode ficar preso numa versão antiga. Precisa ser um <a> real com
   target=_blank: em PWA standalone o iOS bloqueia location.href pra sair do app.
   O carimbo de tempo evita que o próprio navegador devolva o HTML do cache. */
function abrirNoNavegador(a){
  try{ a.href = a.dataset.url + '?r=' + Date.now(); }catch(e){}
  return true;
}
/* Estado do "Como fazer": em variável, não em <details>. O app chama render() ao marcar
   série, e um <details> nativo perderia o aberto a cada toque. */
let exDetalhes = new Set();
/* O FAB é fixed e passava por cima do conteúdo — cobria o botão Editar de exercícios no
   meio da lista. Não dá pra escondê-lo durante o treino (o menu tem "Iniciar treino" e
   "Timer avulso"), então ele sai da frente enquanto a pessoa rola e volta ao parar. */
let _fabT=null;
function fabAoRolar(){
  const f=document.querySelector('.fab-main'); if(!f) return;
  f.classList.add('rolando');
  clearTimeout(_fabT);
  _fabT=setTimeout(()=>f.classList.remove('rolando'), 600);
}
try{ window.addEventListener('scroll', fabAoRolar, {passive:true}); }catch(e){}
function toggleDetalhes(id){
  exDetalhes.has(id) ? exDetalhes.delete(id) : exDetalhes.add(id);
  render();
}
function addSet(id){
  const tod=todaySession(id);
  const stored=(tod&&Array.isArray(tod.sets))?tod.sets:[];
  const fromDom=collect(id);
  // usa o DOM (pega o que foi digitado e ainda não salvou), mas NUNCA encolhe o que já está gravado
  const sets = fromDom.length>=stored.length ? fromDom : stored.slice();
  sets.push({kg:'', reps:'', rir:'', done:false});
  upsertToday(id, sets);
  render();
}
function onComment(inp){ const id=inp.dataset.cid; setTodayComment(id, inp.value); flashSaved(id); }

/* ============ Helpers: última posição planejada + Shortcut deep-link ============ */
function isLastPlannedPosition(day, exIdx, setIdx){
  const W = WK[day]; if(!W) return false;
  if(exIdx !== W.ex.length - 1) return false;
  const planned = exSets(W.ex[exIdx]);
  const tod = todaySession(exId(day, exIdx));
  // conta séries extras: o descanso só é pulado na ÚLTIMA linha real, não na última planejada
  const nset = Math.max(planned, (tod && tod.sets && tod.sets.length) || 0);
  return setIdx === nset - 1;
}
function isLastHomePosition(templateId, exIdx, setIdx){
  const tmpl = HOME_SESSIONS[templateId]; if(!tmpl) return false;
  if(exIdx !== tmpl.ex.length - 1) return false;
  const nset = parseInt(tmpl.ex[exIdx].s) || 3;
  return setIdx === nset - 1;
}
function invokeExternalScheme(url){
  // iOS PWA standalone: location.href com custom scheme (shortcuts://) é
  // silenciosamente bloqueado. Um <a target="_blank"> sintético clicado
  // dentro do mesmo gesto de usuário passa pelo filtro do WebKit.
  try{
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    a.target = '_blank';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ a.remove(); }catch(_){} }, 200);
    return true;
  }catch(e){}
  try{ location.href = url; return true; }catch(e){}
  return false;
}
function maybeInvokeShortcutTimer(seconds){
  if(!ST.meta || !ST.meta.shortcutTimerEnabled) return;
  const name = String(ST.meta.shortcutName||'').trim();
  if(!name) return;
  const s = Math.max(1, Math.round(seconds));
  const url = `shortcuts://run-shortcut?name=${encodeURIComponent(name)}&input=text&text=${s}`;
  invokeExternalScheme(url);
}

function toggleDone(id,k,el){
  el.classList.toggle('on');
  const sets=collect(id);
  if(sets[k]) sets[k].done=el.classList.contains('on');
  upsertToday(id,sets); flashSaved(id);
  if(!el.classList.contains('on')){
    // Desmarcou: se o timer estava rodando por causa deste set, fecha
    const ov=document.getElementById('overlay');
    if(ov && !ov.classList.contains('hidden') && tState==='running'){
      closeTimer();
    }
    return;
  }
  {
    const day=id.split('_')[0], i=+id.split('_')[1];
    // Auto-start session na primeira marcação válida do dia (não pergunta, é o caminho natural)
    if(!isSessionActive() && !alreadyCelebratedToday(day) && isValidDone(sets[k])){
      ST.session.active={workoutId:day, startAt:Date.now(), pausedAt:null, pausedTotal:0};
      saveK('session');
      updateSessionDisplays();
      updateFabMenu();
    }
    // Se sessão estava pausada, retoma sozinho ao checar set
    if(isSessionPaused()){ resumeSession(); }
    const isLast = isLastPlannedPosition(day, i, k);
    const autoFinish = !(ST.meta && ST.meta.autoCompleteOnLastCheck===false); // default true
    // Descanso: pula se for última posição planejada (final do treino)
    if(!isLast){
      // IMPORTANTE: dispara Shortcut ANTES de abrir overlay/audio/etc — iOS PWA
      // exige deep-link como primeira ação do gesto de usuário. Qualquer coisa
      // no meio (openTimer, unlockAudio, requestWakeLock) queima o gesto.
      maybeInvokeShortcutTimer(REST[WK[day].ex[i].t]);
      openTimer(REST[WK[day].ex[i].t]); startTimer();
    }
    // Detecta workout 100% completo → celebra direto (sem perguntar)
    if(isWorkoutComplete(day) && !alreadyCelebratedToday(day)){
      // pequena espera pro user ver o ✓ marcar antes do modal abrir
      setTimeout(()=>{
        if(isWorkoutComplete(day) && !alreadyCelebratedToday(day)){
          closeTimer();
          showCelebration(day);
        }
      }, 600);
    } else if(isLast && autoFinish && !alreadyCelebratedToday(day)){
      // Última posição marcada mas com sets pulados no meio → pergunta
      setTimeout(()=>{
        if(alreadyCelebratedToday(day)) return;
        if(confirm('Último set marcado. Concluir treino agora?')){
          showCelebration(day);
        }
      }, 500);
    }
  }
}

/* ============ TREINO EM CASA — sessão livre (paralela ao ABCD) ============ */
function renderHomeDay(templateId){
  const tmpl=HOME_SESSIONS[templateId];
  if(!tmpl){ openHomeDay=null; return renderDays(); }
  sub.textContent=`Em casa · ${tmpl.name}`;
  const nextDay=suggestedNextDay();
  const skip=(tmpl.canSkipNextDay && tmpl.canSkipNextDay[nextDay]) || [];

  let h=`<div class="backbar"><button class="back" onclick="backToList()">${I.arrowL}<span>Treinos</span></button></div>`;

    let rows="";
    for(let k=0;k<nset;k++){

        <input class="num rir" inputmode="numeric" placeholder="${lv.rir!=null&&lv.rir!==''?lv.rir:'RIR'}" value="${tv.rir!=null?tv.rir:''}" data-id="${id}" data-k="${k}" data-f="rir" oninput="onHomeLog(this)" maxlength="1">

        <div class="exbtns">
          <button class="xb rest" onclick="openTimer(${restS})">${I.timer}<span>Descanso ${Math.floor(restS/60)}:${String(restS%60).padStart(2,'0')}</span></button>
          <button class="xb" onclick="openExEdit('${e.id}')">${I.pencil}<span>Editar</span></button>
        </div>

        <div class="last">${lastTxt}</div>
        <div class="colhead r4"><span></span><span>kg</span><span>reps</span><span>RIR</span><span></span></div>
        ${rows}
        <div class="loghint"><span>kg opcional pra calistenia. Marca ✓ quando terminar a série.</span><span class="saved" id="sv_${id}">${I.check2} salvo</span></div>
        <input class="logcmt" type="text" maxlength="200" placeholder="Comentário do dia (variação, sensação, dor...)" value="${esc(todCmt)}" data-cid="${id}" oninput="onHomeComment(this)">
        ${(()=>{ const pc=commentsFor(id,'free'); return pc.length?`<details class="cmthist"><summary>${I.hist} Comentários anteriores (${pc.length})</summary>${pc.map(c=>`<div class="cmth-row"><span class="cmth-d">${esc(c.date.slice(5).replace('-','/'))}</span><span class="cmth-t">${esc(c.cmt)}</span></div>`).join('')}</details>`:''; })()}
      </div>
    </div>`;
  });

  app.innerHTML=h;
}
function collectHome(id){
  const inputs=document.querySelectorAll(`input[data-id="${id}"]`);
  const map={};
  inputs.forEach(inp=>{
    const k=inp.dataset.k;
    map[k]=map[k]||{};
    map[k][inp.dataset.f]= inp.value.trim();
  });
  const tod=todayFreeSession(id);
  const sets=Object.keys(map).sort((a,b)=>a-b).map(k=>{
    const prev=tod&&tod.sets[k]?tod.sets[k]:{};
    return {kg:map[k].kg||"", reps:map[k].reps||"", rir:map[k].rir!==undefined?map[k].rir:(prev.rir||""), done:prev.done||false};
  });
  return sets;
}
function onHomeLog(inp){ const id=inp.dataset.id; upsertFreeToday(id, collectHome(id)); flashSaved(id); }
function onHomeComment(inp){ const id=inp.dataset.cid; setTodayFreeComment(id, inp.value); flashSaved(id); }
function toggleHomeDone(id,k,el){
  el.classList.toggle('on');
  const sets=collectHome(id);
  if(sets[k]) sets[k].done=el.classList.contains('on');
  upsertFreeToday(id,sets); flashSaved(id);
  if(!el.classList.contains('on')){
    const ov=document.getElementById('overlay');
    if(ov && !ov.classList.contains('hidden') && tState==='running'){ closeTimer(); }
    return;
  }
  // Identifica tipo do exercício pra descanso correto
  const parts=id.split("_");
  const exIdx=+parts.slice(-1)[0];
  const templateId=parts.slice(0,-1).join("_");
  const tmpl=HOME_SESSIONS[templateId];
  const ex=tmpl?.ex[exIdx];
  if(!ex) return;
  // Pula descanso na última posição planejada (final da sessão em casa)
  if(isLastHomePosition(templateId, exIdx, k)) return;
  // Shortcut ANTES do openTimer (ver comentário em toggleDone)
  maybeInvokeShortcutTimer(REST[ex.t] ?? 75);
  openTimer(REST[ex.t] ?? 75); startTimer();
}

function renderHoje(){

  // macros do dia — array de entries {n, q, p, c, k}
  if(ST.protein[t] && !Array.isArray(ST.protein[t])) ST.protein[t]=[];

  const protTarget = (ST.meta.proteinTarget || 150);

  // Próximo treino do ciclo, discreto, só depois de já ter treinado hoje

    h+=`<div class="nextworkout" onclick="setTab('treino');openWorkout('${sug}');">

    h+=`<div class="home-card ${topHome.tier}" onclick="openHome('${topHome.id}')">

/* ============ Hoje helpers (input handlers) ============ */
function setBW(v){
  const t=today(); const n=num(v);
  // remove existing today
  ST.bw = ST.bw.filter(x=>x.date!==t);
  if(n>0) ST.bw.push({date:t, kg:n});
  ST.bw.sort((a,b)=>a.date<b.date?-1:1);
  saveK('bw');
}
function setSleep(v){
  const t=today(); const n=num(v);
  if(n>0) ST.sleep[t]=n; else delete ST.sleep[t];
  saveK('sleep');
}
function updateFoodResults(){
  const inp=document.getElementById('foodSearch'); if(!inp) return;
  const q=inp.value;
  const ul=document.getElementById('foodResults');
  const matches=searchFoods(q);

}

let _lastRemovedFood=null;

/* ============ CORPO — peso, fotos, medidas, volume, PRs ============ */
function renderCorpo(){
  sub.textContent="Onde se mede o progresso real";
  const bws = ST.bw.slice(-30);
  const lastBW = ST.bw.length?ST.bw[ST.bw.length-1]:null;
  const firstBW = ST.bw.length?ST.bw[0]:null;
  const deltaBW = (ST.bw.length>1 && lastBW && firstBW) ? (lastBW.kg-firstBW.kg) : 0;

  let h=``;

  // STATS topo
  const wkVol = weeklyVolume();
  const totalWkSets = Object.values(wkVol).reduce((a,b)=>a+b,0);
  const wksT = weeksTraining();
  h+=`<div class="stats">
    <div class="stat"><div class="l">Semanas treinando</div><div class="v">${wksT}</div><div class="s">desde ${ST.bw[0]?.date?.slice(5)||workoutDates()[0]?.slice(5)||'agora'}</div></div>
    <div class="stat"><div class="l">Séries esta semana</div><div class="v">${Math.round(totalWkSets)}</div><div class="s">total · todos grupos</div></div>
  </div>`;

  // HISTÓRICO DE TREINOS — sessões ABCD concluídas, mais recentes primeiro (data · duração · sets · volume)
  const recentSessions = ST.session.history.slice().sort((a,b)=>(b.endAt||0)-(a.endAt||0)).slice(0,12);
  if(recentSessions.length){
    h+=`<h2 class="sec">Histórico de treinos</h2><div class="histcard">`;
    for(const r of recentSessions){
      const wk=WK[r.workoutId];
      const nm=wk?wk.name:r.workoutId;
      const vol=r.volume?(r.volume>=1000?(r.volume/1000).toFixed(1)+'t':r.volume+'kg'):'';
      h+=`<div class="hrow">
        <div class="hbadge ${wk?wk.type:''}">${r.workoutId}</div>
        <div class="hmeta">
          <div class="hnm">${esc(nm)}</div>
          <div class="hsub">${esc(r.date.slice(5).replace('-','/'))} · ${r.sets||0} sets${vol?` · ${vol}`:''}</div>
        </div>
        <div class="hdur">${fmtDurMin(r.activeMs)}</div>
      </div>`;
    }
    h+=`</div>`;
  }

  // SPARKLINE PESO
  if(bws.length>=2){
    const min=Math.min(...bws.map(b=>b.kg)), max=Math.max(...bws.map(b=>b.kg));
    const rng=Math.max(0.5, max-min);
    const w=300, hh=50;
    const pts = bws.map((b,i)=>{
      const x = (i/(bws.length-1))*w;
      const y = hh - ((b.kg-min)/rng)*hh;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const deltaClass = deltaBW>=0?'up':'dn';
    const deltaSign = deltaBW>=0?'+':'';
    h+=`<div class="spark-card">
      <div class="hdr">
        <div><div class="l">Peso corporal</div><div class="v">${lastBW.kg}<small>kg</small></div></div>
        <div class="delta ${deltaClass}">${deltaSign}${deltaBW.toFixed(1)}kg em ${bws.length} pesagens</div>
      </div>
      ${(()=>{ const r=bwRateInfo();
        if(!r) return `<div class="bwrate none">Pesa 4x ou mais em 4 semanas e eu mostro teu ritmo aqui</div>`;
        return `<div class="bwrate ${r.k}">
          <span class="bwr-v">${r.kgSem>=0?'+':'−'}${Math.abs(r.kgSem).toFixed(2).replace('.',',')}<small>kg/sem</small></span>
          <span class="bwr-p">${Math.abs(r.pct).toFixed(2).replace('.',',')}%</span>
          <span class="bwr-t">${r.txt}</span>
        </div>`; })()}
      <svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none">
        <polyline points="${pts}" fill="none" stroke="url(#sg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5b9eff"/><stop offset="100%" stop-color="#7ab2ff"/></linearGradient></defs>
      </svg>
    </div>`;
  } else {
    h+=`<div class="spark-card"><div class="hdr"><div><div class="l">Peso corporal</div><div class="v" style="font-size:15px;color:var(--muted)">Pesa-te na aba <b style="color:var(--pull)">Hoje</b></div></div></div></div>`;
  }

  // VOLUME SEMANAL POR GRUPO
  h+=`<h2 class="sec">Volume semanal por grupo</h2>
  <div class="volcard">`;
  for(const mg of MG_ORDER){
    const v = wkVol[mg]||0;
    const tgt = MG_TARGETS[mg];
    const pct = Math.min(100, (v/tgt)*100);
    const c = MG_COLOR[mg];
    const tier = tierOf(mg);
    const isPrio = tier<=3;
    const status = v>=tgt ? 'ok' : (v>=tgt*0.7 ? 'ok' : 'low');
    h+=`<div class="vbar2">
      <div class="vn ${isPrio?'prio':''}">${MG_LABELS[mg]}${isPrio?`<span class="tierbadge t${tier}" title="${MG_TIER_LABEL[tier]}">${tier}</span>`:''}</div>
      <div class="track"><div class="fill" style="width:${pct}%;background:linear-gradient(90deg,${c}88,${c})"></div></div>
      <div class="vv"><b>${v.toFixed(v%1?1:0)}</b>/${tgt}</div>
    </div>`;
  }
  h+=`<p class="volnote">Séries duras feitas nos últimos 7 dias. Compostos contam 0.5 pros músculos secundários. <b>★ prioridade</b> · meta acima de 10-12 séries/semana.</p></div>`;

  // PRs por exercício
  const allPRs = [];
  for(const d of ["A","B","C","D"]){
    WK[d].ex.forEach((e,i)=>{
      const id=exId(d,i);
      const best=historicalBestE1RM(id, false);
      const h=ST.logs[id]||[];
      let bestSet=null, bestSetE1=0;
      for(const s of h){
        for(const set of (s.sets||[])){
          const e1=e1RM(set.kg,set.reps);
          if(e1>bestSetE1){ bestSetE1=e1; bestSet={...set, date:s.date}; }
        }
      }
      if(best>0 && e.t==='comp') allPRs.push({name:exName(e), e1:best, set:bestSet});
    });
  }
  if(allPRs.length){
    h+=`<h2 class="sec">PRs · compostos</h2><div class="volcard">`;
    allPRs.sort((a,b)=>b.e1-a.e1).forEach(pr=>{
      h+=`<div class="anchor" style="border-color:var(--line)">
        <span style="font-size:13px">${esc(pr.name)} <small style="color:var(--faint);display:block;font-size:11px;margin-top:2px">${pr.set?`${fmtKg(pr.set.kg)}kg × ${pr.set.reps} em ${pr.set.date.slice(5)}`:''}</small></span>
        <b style="color:var(--core)">${(Math.round(pr.e1*10)/10)}kg<small style="display:block;font-size:9px;color:var(--faint);font-weight:600">e1RM</small></b>
      </div>`;
    });
    h+=`</div>`;
  }

  // MEDIDAS
  const ms=ST.measures;
  const latestM = ms.length? ms[ms.length-1] : null;
  const firstM = ms.length? ms[0] : null;
  h+=`<h2 class="sec">Medidas</h2>
  <div class="check-card">
    <h3><span class="ic" style="color:var(--pull)">${I.ruler}</span>Nova medida de hoje (cm)</h3>
    <div class="measure-grid">`;
  for(const [k,nm,prio,isCustom] of allMeasureFields()){

    h+=`<label class="mfield"><span class="mf-l">${esc(nm)}${isCustom?`<button class="mf-x" onclick="event.preventDefault();removeCustomMeasure('${k}')" title="Remover campo">×</button>`:''}</span><input id="m_${k}" inputmode="decimal" placeholder="${last!==''?last:'—'}"></label>`;
  }
  h+=`</div>
    <input id="m_note" class="logcmt" type="text" maxlength="120" placeholder="Nota (ex: de manhã, em jejum)" style="margin-top:10px">
    <div class="tools" style="margin-top:12px"><button onclick="saveMeasures()">Salvar medidas de hoje</button><button onclick="addCustomMeasure()">+ Medida</button></div>
  </div>`;

  if(latestM){
    // Tendência por medida: valor atual, delta vs primeira, mini-gráfico
    h+=`<div class="check-card">
      <h3><span class="ic" style="color:var(--pull)">${I.trend}</span>Evolução por medida</h3>`;
    for(const [k,nm,prio] of allMeasureFields()){
      const series=measureSeries(k);
      if(!series.length) continue;
      const cur=series[series.length-1].val, base=series[0].val;
      const dv=cur-base, hasDelta=series.length>1;
      const dCol=dv>=0?'var(--ok)':'var(--push)';
      h+=`<div class="mrow">
        <div class="mrow-l"><span class="mrow-n">${esc(nm)}${prio?' <span class="mstar">★</span>':''}</span>
          <span class="mrow-v">${cur.toFixed(1)}<small>cm</small>${hasDelta?` <b style="color:${dCol}">${dv>=0?'+':''}${dv.toFixed(1)}</b>`:''}</span></div>
        ${miniSpark(series)}
      </div>`;
    }
    h+=`<button class="xb" style="margin-top:12px;width:100%" onclick="openMeasCompare()">${I.hist}<span>Comparar 2 datas · corrigir · histórico</span></button>
    </div>`;
  }

  // FOTOS
  const nPhotos=(ST.photometa||[]).length;
  h+=`<h2 class="sec">Fotos · progresso</h2>
  <div class="check-card">
    <h3><span class="ic" style="color:var(--pull)">${I.camera}</span>Foto a cada 2 semanas · mesma luz, pose e horário</h3>
    <div class="angle-uploads">
      <label class="uploadbtn ang">Frente<input type="file" accept="image/*" capture="environment" onchange="addPhoto(this,'front')"></label>
      <label class="uploadbtn ang">Lado<input type="file" accept="image/*" capture="environment" onchange="addPhoto(this,'side')"></label>
      <label class="uploadbtn ang">Costas<input type="file" accept="image/*" capture="environment" onchange="addPhoto(this,'back')"></label>
      <label class="uploadbtn ang custom">+ Outra<input type="file" accept="image/*" capture="environment" onchange="addPhotoCustom(this)"></label>
    </div>`;
  if(nPhotos){
    h+=`<button class="xb" style="margin-top:10px;width:100%" onclick="openPhotoCompare()">${I.trend}<span>Comparar fotos (antes/depois)</span></button>`;
    for(const ang of anglesPresent()){
      const list=photosByAngle(ang);
      if(!list.length) continue;
      h+=`<div class="pgroup-h">${esc(angleLabel(ang))} · ${list.length}</div><div class="photos-grid">`;
      list.slice().reverse().forEach(p=>{
        h+=`<div class="pthumb">

        </div>`;

      h+=`</div>`;
    }
  } else {
    h+=`<div style="margin-top:12px;font-size:12px;color:var(--faint)">Nenhuma foto ainda. Frente, lado e costas dão a comparação mais justa. Use "+ Outra" pra focos específicos (bíceps, perna…).</div>`;
  }
  h+=`</div>`;

  app.innerHTML=h;
  hydratePhotos(app);
}

// séries de uma medida (só datas que têm o valor), ascendente
// Campos de medida = base (MEASURE_FIELDS) + customizados do usuário (ST.meta.customMeasures)
function allMeasureFields(){
  const custom=((ST.meta&&ST.meta.customMeasures)||[]).map(c=>[c.key, c.label, false, true]); // 4º = isCustom
  return MEASURE_FIELDS.concat(custom);
}
function addCustomMeasure(){
  const label=(typeof prompt==='function'?prompt('Nome da nova medida (ex: Pescoço, Bíceps E, Cintura baixa):'):'')||'';
  const lb=label.trim(); if(!lb) return;
  if(!ST.meta||typeof ST.meta!=='object') ST.meta={};
  if(!Array.isArray(ST.meta.customMeasures)) ST.meta.customMeasures=[];
  const taken=new Set(allMeasureFields().map(f=>f[0]));
  let base='c_'+(normTxt(lb).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,20)||'x');
  let key=base, i=2; while(taken.has(key)) key=base+'_'+(i++);
  ST.meta.customMeasures.push({key, label:lb.slice(0,28)});
  saveK('meta'); renderCorpo(); showToast('Medida adicionada', 'ok');
}
function removeCustomMeasure(key){
  if(!confirm('Remover esse campo de medida? (os valores já registrados ficam guardados, só somem da lista)')) return;
  if(ST.meta&&Array.isArray(ST.meta.customMeasures)) ST.meta.customMeasures=ST.meta.customMeasures.filter(c=>c.key!==key);
  saveK('meta'); renderCorpo();
}
function measureSeries(key){
  return ST.measures.filter(m=>m[key]!=null && m[key]!=='').map(m=>({date:m.date, val:num(m[key])}));
}
// peso mais próximo de uma data (pra comparação de medidas)
function nearestBW(date){
  if(!ST.bw||!ST.bw.length) return null;
  let best=null, bd=1e9;
  for(const b of ST.bw){ const d=Math.abs(daysBetween(b.date,date)); if(d<bd){ bd=d; best=b; } }
  return best?{kg:best.kg, date:best.date, off:bd}:null;
}
// mini sparkline neutro (cor única — direção não implica bom/ruim; cintura↓ e ombro↑ são ambos bons)
function miniSpark(series){
  if(!series||series.length<2) return `<span class="mspark-empty">1 medição</span>`;
  const w=96,hh=26,pad=3;
  const vals=series.map(s=>s.val), mn=Math.min(...vals), mx=Math.max(...vals), rng=Math.max(0.1,mx-mn);
  const pts=series.map((s,i)=>{
    const x=pad+(i/(series.length-1))*(w-2*pad);
    const y=hh-pad-((s.val-mn)/rng)*(hh-2*pad);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return `<svg class="mspark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#5b9eff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function saveMeasures(){
  const t=today();
  const m={date:t};
  let any=false;
  for(const [k] of allMeasureFields()){
    const el=document.getElementById('m_'+k);
    if(el && (el.value||'').trim()){ m[k]=num(el.value); any=true; }
  }
  if(!any){ showToast('Preencha pelo menos uma medida', 'warn', 2000); return; }
  const noteEl=document.getElementById('m_note');
  const note=noteEl&&(noteEl.value||'').trim();
  if(note) m.note=note;
  ST.measures = ST.measures.filter(x=>x.date!==t);
  ST.measures.push(m);
  ST.measures.sort((a,b)=>a.date<b.date?-1:1);
  if(saveK('measures')){ showToast('Medidas salvas', 'ok', 1800); }
  renderCorpo();
}

// Adiciona foto: comprime -> IndexedDB (pixel) + ST.photometa (metadado). Só grava o metadado
// DEPOIS de confirmar o pixel no IDB (nada de miniatura quebrada). angle: front|side|back|<custom>.
function addPhotoFile(f, angle){
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=720; const ratio=Math.min(1, maxW/img.width);
      const w=Math.round(img.width*ratio), hh=Math.round(img.height*ratio);
      const c=document.createElement('canvas'); c.width=w; c.height=hh;
      c.getContext('2d').drawImage(img,0,0,w,hh);
      const dataUrl=c.toDataURL('image/jpeg', 0.75);
      const id=nextPhotoId();
      pdbPut(id, dataUrl).then(()=>{
        ST.photometa.push({id, date:today(), angle:angle||'front'});
        ST.photometa.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
        saveK('photometa'); saveK('meta');
        showToast('Foto salva', 'ok', 1500);
        renderCorpo();
      }).catch(err=>{
        console.error('pdbPut', err);
        alert('Não consegui salvar a foto (armazenamento). Tente de novo.');
      });
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}
function addPhoto(input, angle){ addPhotoFile(input.files&&input.files[0], angle); }
function addPhotoCustom(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const label=(typeof prompt==='function'?prompt('Nome desse foco/ângulo (ex: Bíceps, Perna, Costas relaxado):'):'')||'';
  const lb=label.trim(); if(!lb){ input.value=''; return; }
  addPhotoFile(f, lb.slice(0,24));
}
function delPhotoById(id){
  if(!confirm('Apagar essa foto?')) return;
  pdbDel(id).catch(()=>{}).then(()=>{
    ST.photometa = ST.photometa.filter(p=>p.id!==id);
    saveK('photometa'); renderCorpo();
  });
}

/* ---- Comparar MEDIDAS (2 datas + histórico) ---- */
let mcA=null, mcB=null;
function measDates(){ return ST.measures.map(m=>m.date); }
function openMeasCompare(){
  const d=measDates(); if(!d.length){ showToast('Sem medidas ainda','warn'); return; }
  mcA=d[0]; mcB=d[d.length-1];
  document.getElementById('measCompare').classList.remove('hidden');
  renderMeasCompare();
}
function closeMeasCompare(){ document.getElementById('measCompare').classList.add('hidden'); }
function mcSet(which,val){ if(which==='a') mcA=val; else mcB=val; renderMeasCompare(); }
function renderMeasCompare(){
  const d=measDates();
  const A=ST.measures.find(m=>m.date===mcA)||{}, B=ST.measures.find(m=>m.date===mcB)||{};
  const opt=(sel)=>d.map(x=>`<option value="${x}" ${x===sel?'selected':''}>${esc(x.slice(5).replace('-','/'))}</option>`).join('');
  const line=(label,a,b,unit,star)=>{
    const dv=(a!=null&&b!=null)?(b-a):null;
    const dc=dv==null?'':(dv>=0?'var(--ok)':'var(--push)');
    return `<tr><td class="mc-n">${esc(label)}${star?' <span class="mstar">★</span>':''}</td>
      <td>${a!=null?a.toFixed(1):'–'}</td><td>${b!=null?b.toFixed(1):'–'}</td>
      <td style="color:${dc};font-weight:700">${dv==null?'–':(dv>=0?'+':'')+dv.toFixed(1)}</td></tr>`;
  };
  let rows='';
  const wA=nearestBW(mcA), wB=nearestBW(mcB);
  if(wA||wB) rows+=line('Peso (kg)', wA?wA.kg:null, wB?wB.kg:null,'kg',false);
  for(const [k,nm,prio] of allMeasureFields()){
    if(A[k]==null && B[k]==null) continue;
    rows+=line(nm, A[k]!=null?num(A[k]):null, B[k]!=null?num(B[k]):null,'cm',prio);
  }

    <div class="mc-picker"><select onchange="mcSet('a',this.value)">${opt(mcA)}</select><span class="mc-arrow">→</span><select onchange="mcSet('b',this.value)">${opt(mcB)}</select></div>

/* ---- Editar/corrigir uma medição anterior ---- */
let meEditDate=null;
function openMeasEdit(date){
  const m=ST.measures.find(x=>x.date===date); if(!m) return;
  meEditDate=date;
  let grid='';
  for(const [k,nm,prio,isCustom] of allMeasureFields()){
    grid+=`<label class="mfield"><span class="mf-l">${esc(nm)}</span><input id="me_${k}" inputmode="decimal" value="${m[k]!=null?num(m[k]):''}" placeholder="—"></label>`;
  }
  document.getElementById('measEditBody').innerHTML=`
    <div class="me-date">Medição de ${esc(date.slice(5).replace('-','/'))}</div>
    <div class="measure-grid">${grid}</div>
    <input id="me_note" class="logcmt" type="text" maxlength="120" value="${esc(m.note||'')}" placeholder="Nota" style="margin-top:10px">
    <div class="exedit-ctrl">
      <button class="exedit-btn ghost" onclick="deleteMeasEdit()">Excluir</button>
      <button class="exedit-btn cancel" onclick="closeMeasEdit()">Cancelar</button>
      <button class="exedit-btn save" onclick="saveMeasEdit()">Salvar</button>
    </div>`;
  document.getElementById('measEdit').classList.remove('hidden');
}
function closeMeasEdit(){ document.getElementById('measEdit').classList.add('hidden'); meEditDate=null; }
function saveMeasEdit(){
  if(!meEditDate) return;
  const m={date:meEditDate};
  let any=false;
  for(const [k] of allMeasureFields()){
    const el=document.getElementById('me_'+k);
    if(el && (el.value||'').trim()){ m[k]=num(el.value); any=true; }
  }
  const noteEl=document.getElementById('me_note');
  const note=noteEl&&(noteEl.value||'').trim(); if(note) m.note=note;
  if(!any && !note){ // esvaziou tudo = excluir
    if(!confirm('Nenhum valor preenchido — excluir essa medição?')){ return; }
    ST.measures=ST.measures.filter(x=>x.date!==meEditDate);
  } else {
    ST.measures=ST.measures.filter(x=>x.date!==meEditDate);
    ST.measures.push(m);
    ST.measures.sort((a,b)=>a.date<b.date?-1:1);
  }
  saveK('measures'); closeMeasEdit(); renderCorpo();
  if(!document.getElementById('measCompare').classList.contains('hidden')){ const d=measDates(); if(d.length){ if(!d.includes(mcA))mcA=d[0]; if(!d.includes(mcB))mcB=d[d.length-1]; renderMeasCompare(); } }
  showToast('Medição atualizada', 'ok');
}
function deleteMeasEdit(){
  if(!meEditDate) return;
  if(!confirm('Excluir a medição de '+meEditDate.slice(5).replace('-','/')+'?')) return;
  ST.measures=ST.measures.filter(x=>x.date!==meEditDate);
  saveK('measures'); closeMeasEdit(); renderCorpo();
  const cmp=document.getElementById('measCompare');
  if(cmp && !cmp.classList.contains('hidden')){ const d=measDates(); if(d.length){ mcA=d[0]; mcB=d[d.length-1]; renderMeasCompare(); } else closeMeasCompare(); }
  showToast('Medição excluída', 'ok');
}

/* ---- Comparar FOTOS (ângulo + lado a lado / slider / sobreposição) ---- */
let pcAngle='front', pcA=null, pcB=null, pcMode='side';
function openPhotoCompare(){
  const angs=anglesPresent();
  pcAngle = angs.find(a=>photosByAngle(a).length>=2) || angs[0] || 'front';
  pcResetDates(); pcMode='side';
  document.getElementById('photoCompare').classList.remove('hidden');
  renderPhotoCompare();
}
function closePhotoCompare(){ document.getElementById('photoCompare').classList.add('hidden'); }
function pcResetDates(){ const l=photosByAngle(pcAngle); pcA=l.length?l[0].id:null; pcB=l.length?l[l.length-1].id:null; }
function pcSetAngle(a){ pcAngle=a; pcResetDates(); renderPhotoCompare(); }
function pcSetDate(which,id){ if(which==='a') pcA=id; else pcB=id; renderPhotoCompare(); }
function pcSetMode(m){ pcMode=m; renderPhotoCompare(); }
function pcMeta(id){ return (ST.photometa||[]).find(p=>p.id===id)||null; }
function pcWeightLine(id){ const m=pcMeta(id); if(!m) return ''; const w=nearestBW(m.date); return w?` · ${w.kg}kg`:''; }
function renderPhotoCompare(){
  const list=photosByAngle(pcAngle);
  const angBtns=anglesPresent().map(a=>{
    const n=photosByAngle(a).length;
    return `<button class="pc-ang ${a===pcAngle?'on':''}" onclick="pcSetAngle('${esc(a).replace(/'/g,"\\'")}')">${esc(angleLabel(a))}${n?` (${n})`:''}</button>`;
  }).join('');
  const modeBtns=[['side','Lado a lado'],['slider','Slider'],['overlay','Sobrepor']].map(([m,l])=>
    `<button class="pc-mode ${m===pcMode?'on':''}" onclick="pcSetMode('${m}')">${l}</button>`).join('');
  const opt=(sel)=>list.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.date.slice(5).replace('-','/'))}</option>`).join('');
  let view='';
  if(list.length<1){
    view=`<div class="pc-empty">Nenhuma foto de ${esc(angleLabel(pcAngle))} ainda.</div>`;
  } else if(list.length<2 || pcA===pcB){
    view=`<div class="pc-empty">Precisa de 2 fotos deste ângulo pra comparar.</div>`;
  } else {
    const mA=pcMeta(pcA), mB=pcMeta(pcB);
    const capA=`${esc(mA.date.slice(5).replace('-','/'))}${pcWeightLine(pcA)}`;
    const capB=`${esc(mB.date.slice(5).replace('-','/'))}${pcWeightLine(pcB)}`;
    if(pcMode==='side'){
      view=`<div class="pc-side">
        <figure><img data-pid="${pcA}" alt=""><figcaption>${capA}</figcaption></figure>
        <figure><img data-pid="${pcB}" alt=""><figcaption>${capB}</figcaption></figure>
      </div>`;
    } else if(pcMode==='slider'){
      view=`<div class="pc-stage"><div class="pc-slider">
        <img class="pc-base" data-pid="${pcB}" alt="">
        <img class="pc-clip" id="pcClip" data-pid="${pcA}" alt="" style="clip-path:inset(0 50% 0 0)">
        <div class="pc-divider" id="pcDiv" style="left:50%"></div>
      </div>
      <input type="range" min="0" max="100" value="50" class="pc-range" oninput="pcSlide(this.value)">
      <div class="pc-cap"><span>${capA}</span><span>${capB}</span></div></div>`;
    } else {
      view=`<div class="pc-stage"><div class="pc-slider">
        <img class="pc-base" data-pid="${pcB}" alt="">
        <img class="pc-over" id="pcOver" data-pid="${pcA}" alt="" style="opacity:.5">
      </div>
      <input type="range" min="0" max="100" value="50" class="pc-range" oninput="pcFade(this.value)">
      <div class="pc-cap"><span>${capA} (frente)</span><span>${capB} (fundo)</span></div></div>`;
    }
  }
  document.getElementById('photoCompareBody').innerHTML=`
    <div class="pc-angs">${angBtns}</div>
    ${list.length>=2?`<div class="mc-picker"><select onchange="pcSetDate('a',this.value)">${opt(pcA)}</select><span class="mc-arrow">→</span><select onchange="pcSetDate('b',this.value)">${opt(pcB)}</select></div>
    <div class="pc-modes">${modeBtns}</div>`:''}
    ${view}`;
  hydratePhotos(document.getElementById('photoCompareBody'));
}
function pcSlide(v){ const c=document.getElementById('pcClip'), d=document.getElementById('pcDiv'); if(c) c.style.clipPath='inset(0 '+(100-v)+'% 0 0)'; if(d) d.style.left=v+'%'; }

async function exportData(){
  const t=document.getElementById('exp'); t.classList.remove('hidden');
  const full={_v:1, _at:new Date().toISOString()};
  for(const k of Object.keys(LS)) full[k]=ST[k];
  const json=JSON.stringify(full);
  t.value=json; t.select();
  // Marca data do backup pra evitar nag até 7d
  if(!ST.meta) ST.meta={};
  ST.meta.lastBackupAt=Date.now();
  saveK('meta');
  // Tenta clipboard + share automático (iOS share sheet)
  let copied=false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(json);
      copied=true;
    }
  }catch(e){}
  if(copied){
    showToast('Backup copiado pra área de transferência ✓', 'ok', 2500);
  }
  // Oferece share sheet (cole no Notes, Mail, Files, etc.)
  try{
    if(navigator.share){
      const filename=`meutreino-backup-${localISO()}.json`;
      const file=new File([json], filename, {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'MeuTreino Backup'});
      } else {
        await navigator.share({title:'MeuTreino Backup', text:json});
      }
    }
  }catch(e){ /* share cancel ou unsupported, segue */ }
  if(!copied) showToast('Backup gerado abaixo — copie pra um lugar seguro', 'info', 3000);
}
function importData(){
  const v=document.getElementById('imp').value.trim(); if(!v) return;
  try{
    const o=JSON.parse(v);
    // Reset ST inteiro pro default antes de aplicar (evita Frankenstein)
    if(o.logs!==undefined){
      for(const k of Object.keys(LS)){
        ST[k] = (o[k]!==undefined) ? o[k] : JSON.parse(JSON.stringify(DEFAULTS[k]));
        saveK(k);
      }
    } else {
      // backup MUITO antigo: só logs em raiz
      for(const k of Object.keys(LS)){
        ST[k] = JSON.parse(JSON.stringify(DEFAULTS[k]));
      }
      ST.logs=o; saveK('logs');
    }
    // re-roda migração de protein
    for(const date in ST.protein){
      if(!Array.isArray(ST.protein[date])) ST.protein[date]=[];
    }
    alert('Backup importado.'); render();
  } catch(e){ alert('Backup inválido: '+e.message); }
}

    pdbClear(); // apaga também os pixels das fotos no IndexedDB
    render();
  }
}

/* ---- Backup de FOTOS (separado — pixels moram no IndexedDB, arquivo grande) ---- */
function pdbClear(){ return pdbOpen().then(db=>new Promise((res)=>{ const tx=db.transaction(PDB_STORE,'readwrite'); tx.objectStore(PDB_STORE).clear(); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); })).catch(()=>{}); }
async function exportPhotos(){
  const metas=ST.photometa||[];
  if(!metas.length){ showToast('Nenhuma foto pra exportar','warn'); return; }
  showToast('Preparando backup de fotos…','info',2500);
  const photos=[];
  for(const m of metas){ try{ const url=await pdbGet(m.id); if(url) photos.push({id:m.id, date:m.date, angle:m.angle, dataUrl:url}); }catch(e){} }
  const json=JSON.stringify({_v:1, _type:'meutreino-photos', _at:new Date().toISOString(), photos});
  const filename=`meutreino-fotos-${localISO()}.json`;
  try{
    if(navigator.share){
      const file=new File([json], filename, {type:'application/json'});
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'MeuTreino Fotos'}); return; }
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([json],{type:'application/json'})); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
    showToast('Backup de '+photos.length+' foto(s) gerado', 'ok', 3000);
  }catch(e){ showToast('Falha ao gerar backup de fotos', 'warn'); }
}
// Importa um bundle NÃO-DESTRUTIVO (merge): fotos (IDB) + medidas + campos custom.
// Nunca apaga o que já existe — fotos por id, medidas mescladas por data (campo a campo),
// campos custom deduplicados por key. Serve pro backup de fotos E pra "colar" novos dados.
function importPhotos(input){
  const f=input.files&&input.files[0]; if(!f){ return; }
  const r=new FileReader();
  r.onload=async()=>{
    try{
      const o=JSON.parse(r.result);
      if(!ST.meta||typeof ST.meta!=='object') ST.meta={};
      // 1) campos de medida customizados (dedup por key)
      let nCustom=0;
      if(Array.isArray(o.customMeasures)){
        if(!Array.isArray(ST.meta.customMeasures)) ST.meta.customMeasures=[];
        for(const c of o.customMeasures){
          if(c&&c.key&&c.label&&!ST.meta.customMeasures.some(x=>x.key===c.key)){ ST.meta.customMeasures.push({key:c.key, label:String(c.label).slice(0,28)}); nCustom++; }
        }
      }
      // 2) medidas (merge por data, campo a campo — não sobrescreve outras datas)
      let nMeas=0;
      if(Array.isArray(o.measures)){
        for(const m of o.measures){
          if(!m||!m.date) continue;
          const ex=ST.measures.find(x=>x.date===m.date);
          if(ex) Object.assign(ex, m); else ST.measures.push({...m});
          nMeas++;
        }
        ST.measures.sort((a,b)=>a.date<b.date?-1:1);
      }
      // 3) fotos (pixel no IDB + metadado; por id, sem duplicar)
      const arr=Array.isArray(o.photos)?o.photos:[];
      let n=0, maxSeq=ST.meta.photoSeq||0;
      for(const p of arr){
        if(!p||!p.id||!p.dataUrl) continue;
        try{
          await pdbPut(p.id, p.dataUrl);
          if(!ST.photometa.some(m=>m.id===p.id)) ST.photometa.push({id:p.id, date:p.date||today(), angle:p.angle||'front'});
          const sq=parseInt(String(p.id).replace(/^p/,'')); if(isFinite(sq)&&sq>maxSeq) maxSeq=sq;
          n++;
        }catch(e){}
      }
      ST.meta.photoSeq=maxSeq;
      ST.photometa.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
      if(nMeas) saveK('measures');
      saveK('photometa'); saveK('meta');
      if(!n && !nMeas && !nCustom){ alert('Arquivo sem dados reconhecidos.'); return; }
      alert('Importado: '+n+' foto(s), '+nMeas+' medição(ões), '+nCustom+' campo(s) novo(s).'); renderCorpo();
    }catch(e){ alert('Arquivo inválido: '+e.message); }
  };
  r.readAsText(f);
}
function clearTodayData(){
  if(!confirm('Apagar SETS, sessão ativa e celebração de HOJE (mantém peso/sono/macros/cardio de hoje + todos os outros dias)?')) return;
  const t=todayISO();
  // 1. Remove sets de hoje de todos os exercícios
  let removedLogs=0;
  for(const id in ST.logs){
    if(Array.isArray(ST.logs[id])){
      const before=ST.logs[id].length;
      ST.logs[id]=ST.logs[id].filter(s=>s.date!==t);
      removedLogs += before - ST.logs[id].length;
      if(!ST.logs[id].length) delete ST.logs[id];
    }
  }
  saveK('logs');
  // 2. Remove celebrações de hoje
  if(ST.session && Array.isArray(ST.session.history)){
    ST.session.history = ST.session.history.filter(h=>h.date!==t);
  }
  // 3. Limpa sessão ativa
  if(ST.session) ST.session.active = null;
  saveK('session');
  // 4. Cancela push agendado se tinha algo no ar
  cancelRemotePushes();
  showToast(`Dia limpo — ${removedLogs} sets removidos`,'ok',2500);
  render();
}

/* ============ TIMER (state machine: idle | running | paused | done) ============ */
let tTotal=90, tLeft=90, tRun=false, tInt=null, aCtx=null, wakeLock=null;
let tState='idle', tEndAt=0, autoCloseTO=null, tMinimized=false;
const CIRC=2*Math.PI*96;

function minimizeTimer(){
  // Só faz sentido se há timer rodando ou em done
  if(tState==='idle') return;
  tMinimized=true;
  const ov=document.getElementById('overlay');
  if(ov) ov.classList.add('hidden');
  const mt=document.getElementById('miniTimer');
  if(mt){
    mt.classList.remove('hidden');
    mt.setAttribute('data-state', tState==='done' ? 'done' : 'running');
  }
  updateMiniTimer();
}
function expandTimer(){
  tMinimized=false;
  const mt=document.getElementById('miniTimer');
  if(mt){ mt.classList.add('hidden'); mt.removeAttribute('data-state'); }
  const ov=document.getElementById('overlay');
  if(ov) ov.classList.remove('hidden');
  paint();
}
function updateMiniTimer(){
  if(!tMinimized) return;
  const v=document.getElementById('miniTimerVal');
  if(v){
    v.textContent = tState==='done' ? '✓ pronto' : fmt(tLeft);
  }
  const mt=document.getElementById('miniTimer');
  if(mt){
    mt.setAttribute('data-state', tState==='done' ? 'done' : 'running');
  }
}

// Unlock audio context na primeira interação (essencial pro iOS)
function unlockAudio(){
  try{
    if(!aCtx) aCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(aCtx.state==='suspended') aCtx.resume();
  }catch(e){}
}
document.addEventListener('touchstart', unlockAudio, {passive:true});
document.addEventListener('click', unlockAudio, {passive:true});

function fmt(s){ return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,'0'); }
function paint(){
  const tv=document.getElementById('tval'); if(tv) tv.textContent=fmt(tLeft);
  const rf=document.getElementById('ringfill');
  if(rf){ const off=CIRC*(1-tLeft/tTotal); rf.style.strokeDashoffset=off; }
  if(tMinimized) updateMiniTimer();
}
function clearTimerStateOnly(){
  if(tInt){ clearInterval(tInt); tInt=null; }
  if(autoCloseTO){ clearTimeout(autoCloseTO); autoCloseTO=null; }
  tRun=false; tEndAt=0;
}
function setTimer(s){
  clearTimerStateOnly();
  tState='idle';
  const ov=document.getElementById('overlay'); if(ov) ov.removeAttribute('data-state');
  const ppb=document.getElementById('ppbtn');
  if(ppb){ ppb.textContent='Iniciar'; ppb.removeAttribute('data-state'); }
  tTotal=s; tLeft=s;
  const rf=document.getElementById('ringfill'); if(rf) rf.setAttribute('stroke-dasharray',CIRC);
  document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('active', +b.dataset.s===s));
  paint();
}
function openTimer(s){
  if(typeof s==='number') setTimer(s); else setTimer(tTotal);
  document.getElementById('overlay').classList.remove('hidden');
  updateShortcutLink(typeof s==='number' ? s : tTotal);
  paint();
}
function updateShortcutLink(seconds){
  const link = document.getElementById('shortcutLink');
  if(!link) return;
  // Basta ter o nome do Atalho configurado — toggle controla só o disparo automático.
  // O botão manual funciona sempre que o nome estiver setado.
  const name = ST.meta && String(ST.meta.shortcutName||'').trim();
  if(!name){ link.classList.add('hidden'); return; }
  const s = Math.max(1, Math.round(seconds||0));
  link.href = `shortcuts://run-shortcut?name=${encodeURIComponent(name)}&input=text&text=${s}`;
  link.classList.remove('hidden');
}
function markShortcutInvoked(){
  // Chamado quando user toca no link manual — só pra feedback visual
  showToast('Chamando Atalhos…','ok',1500);
}
function closeTimer(){
  // Se timer estava rodando, cancela push agendado (evita disparar depois do user fechar)
  if(tState==='running') cancelRemotePushes();
  clearTimerStateOnly();
  tState='idle';
  tMinimized=false;
  releaseWakeLock();
  const ov=document.getElementById('overlay');
  if(ov){ ov.classList.add('hidden'); ov.removeAttribute('data-state'); }
  const mt=document.getElementById('miniTimer');
  if(mt){ mt.classList.add('hidden'); mt.removeAttribute('data-state'); }
  const ppb=document.getElementById('ppbtn');
  if(ppb){ ppb.textContent='Iniciar'; ppb.removeAttribute('data-state'); }
}
function toggleTimer(){
  if(tState==='done'){ closeTimer(); return; }
  if(tRun){ pauseTimer(); } else { startTimer(); }
}
async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock=null; });
    }
  }catch(e){}
}
function releaseWakeLock(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){}
}
// Visibility: re-adquire wake lock + reconciliar timer ao voltar do bg
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible') return;
  // Reconcilia tempo (setInterval throttla em bg no iOS)
  if(tState==='running' && tEndAt>0){
    tLeft=Math.max(0,(tEndAt-Date.now())/1000);
    paint();
    if(tLeft<=0){ timerDone(); return; }
    if(!wakeLock) requestWakeLock();
  }
  // Auto-close se ficou "done" no bg por mais de 5s
  if(tState==='done' && !autoCloseTO){
    autoCloseTO=setTimeout(closeTimer, 1500);
  }
});

function startTimer(){
  if(tRun) return;
  if(tLeft<=0) tLeft=tTotal;
  tRun=true; tState='running';
  unlockAudio();
  maybeRequestNotificationPermission();
  const ppb=document.getElementById('ppbtn'); if(ppb) ppb.textContent='Pausar';
  requestWakeLock();
  tEndAt=Date.now()+tLeft*1000;
  // Nota: maybeInvokeShortcutTimer é disparado ANTES de openTimer/startTimer,
  // direto de toggleDone/toggleHomeDone, pra preservar o user gesture no iOS.
  // Chamar aqui não funciona em PWA standalone — o gesto já foi queimado.
  // Agenda push remoto (via Worker) — funciona com app fechado/tela bloqueada
  scheduleRemotePush(tEndAt);
  tInt=setInterval(()=>{
    tLeft=Math.max(0,(tEndAt-Date.now())/1000);
    paint();
    if(tLeft<=0){ timerDone(); }
  }, 100);
}
function pauseTimer(){
  if(!tRun) return;
  tRun=false; tState='paused';
  if(tInt){ clearInterval(tInt); tInt=null; }
  tEndAt=0;
  const b=document.getElementById('ppbtn'); if(b) b.textContent='Iniciar';
  cancelRemotePushes();
}
function timerDone(){
  clearTimerStateOnly();
  tState='done';
  releaseWakeLock();
  // Se estava minimizado, expande pro user ver o estado done — feedback óbvio
  if(tMinimized){ expandTimer(); }
  const ov=document.getElementById('overlay');
  if(ov) ov.setAttribute('data-state','done');
  const ppb=document.getElementById('ppbtn');
  if(ppb){ ppb.textContent='Fechar'; ppb.setAttribute('data-state','done'); }
  playChime();
  notifyTimerDone();
  flashDone();
  autoCloseTO=setTimeout(closeTimer, 5000);
}

/* ============ Audio + Notifications ============ */
// Chime: acorde C5-E5-G5 com envelope sino. AudioContext resume agressivo.
function playChime(){
  try{
    if(!aCtx) aCtx=new (window.AudioContext||window.webkitAudioContext)();
    // resume mesmo se aparenta running (iOS às vezes mente)
    if(aCtx.state!=='running'){ aCtx.resume(); }
    const notes=[523.25,659.25,783.99];
    notes.forEach((freq,i)=>{
      const startAt=aCtx.currentTime+i*0.10;
      const o=aCtx.createOscillator(); o.type='sine'; o.frequency.value=freq;
      const o2=aCtx.createOscillator(); o2.type='sine'; o2.frequency.value=freq/2;
      const g=aCtx.createGain(); const g2=aCtx.createGain();
      o.connect(g); o2.connect(g2);
      g.connect(aCtx.destination); g2.connect(aCtx.destination);
      g.gain.setValueAtTime(0.001,startAt);
      g.gain.exponentialRampToValueAtTime(0.22,startAt+0.015);
      g.gain.exponentialRampToValueAtTime(0.001,startAt+1.4);
      g2.gain.setValueAtTime(0.001,startAt);
      g2.gain.exponentialRampToValueAtTime(0.10,startAt+0.025);
      g2.gain.exponentialRampToValueAtTime(0.001,startAt+1.6);
      o.start(startAt); o.stop(startAt+1.5);
      o2.start(startAt); o2.stop(startAt+1.7);
    });
  }catch(e){ console.warn('chime fail', e); }
  // Vibração só Android (iOS Safari ignora silenciosamente)
  try{
    if('vibrate' in navigator && /Android/.test(navigator.userAgent)){
      navigator.vibrate([120,60,120]);
    }
  }catch(e){}
}

/* ============ REMOTE PUSH via Cloudflare Worker ============ */
function urlBase64ToUint8Array(base64){
  const padding='='.repeat((4-base64.length%4)%4);
  const b64=(base64+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b64);
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function pushConfigured(){
  return !!(ST.meta && ST.meta.workerUrl && ST.meta.workerToken);
}
async function subscribeForPush(){
  if(!pushConfigured()){ showToast('Configure o Worker em Mais primeiro','warn',2500); return null; }
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    showToast('PushManager não suportado neste browser','warn',2500); return null;
  }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      const r=await fetch(`${ST.meta.workerUrl}/vapid-key`,{cache:'no-store'});
      if(!r.ok) throw new Error('vapid-key '+r.status);
      const {publicKey}=await r.json();
      if(!publicKey) throw new Error('publicKey ausente');
      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(publicKey),
      });
    }
    const r2=await fetch(`${ST.meta.workerUrl}/subscribe`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${ST.meta.workerToken}`},
      body:JSON.stringify({subscription:sub.toJSON()}),
    });
    if(!r2.ok) throw new Error('subscribe '+r2.status);
    const {hash}=await r2.json();
    if(!ST.meta) ST.meta={};
    ST.meta.pushHash=hash;
    saveK('meta');
    showToast('Push subscrito ✓','ok',2200);
    return hash;
  }catch(e){
    console.error('subscribeForPush', e);
    showToast('Falha no subscribe: '+e.message,'warn',3500);
    return null;
  }
}
async function scheduleRemotePush(fireAt, title, body){
  if(!pushConfigured() || !ST.meta.pushHash) return;
  try{
    await fetch(`${ST.meta.workerUrl}/schedule`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${ST.meta.workerToken}`},
      body:JSON.stringify({hash:ST.meta.pushHash, fireAt, title, body}),
    });
  }catch(e){ /* silent */ }
}
async function cancelRemotePushes(){
  if(!pushConfigured() || !ST.meta.pushHash) return;
  try{
    await fetch(`${ST.meta.workerUrl}/cancel`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${ST.meta.workerToken}`},
      body:JSON.stringify({hash:ST.meta.pushHash}),
    });
  }catch(e){}
}
async function testRemotePush(){
  if(!pushConfigured()){ showToast('Configure Worker URL + Token primeiro','warn',2500); return; }
  if(!ST.meta.pushHash){
    showToast('Sem subscription — toca em "Ativar push" primeiro','warn',3000); return;
  }
  try{
    const r=await fetch(`${ST.meta.workerUrl}/test`,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${ST.meta.workerToken}`},
      body:JSON.stringify({hash:ST.meta.pushHash}),
    });
    if(r.ok) showToast('Push de teste enviado — chega em ~5s','ok',2500);
    else showToast('Erro: '+r.status,'warn',3000);
  }catch(e){ showToast('Falha: '+e.message,'warn',3000); }
}

let notifPermAsked=false;
function maybeRequestNotificationPermission(){
  if(notifPermAsked) return;
  if(!('Notification' in window)) return;
  notifPermAsked=true;
  try{
    if(Notification.permission==='default'){
      Notification.requestPermission().then(p=>{
        if(p==='granted') showToast('Notificações ativas ✓','ok',2000);
        else if(p==='denied') showToast('Notificações bloqueadas — só som dentro do app','warn',3500);
      }).catch(()=>{});
    }
  }catch(e){}
}

function notifyTimerDone(){
  if(!('Notification' in window)) return;
  if(Notification.permission!=='granted') return;
  const opts={
    body:'Próxima série!',
    icon:'icon-192.png',
    badge:'icon-192.png',
    tag:'meutreino-timer',
    renotify:true,
  };
  // Prefere SW.showNotification (melhor sobrevivência em bg) → fallback Notification direto
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(reg=>{
        if(reg && reg.showNotification){
          reg.showNotification('Descanso terminado', opts).catch(()=>{
            try{ new Notification('Descanso terminado', opts); }catch(e){}
          });
          return;
        }
        try{ new Notification('Descanso terminado', opts); }catch(e){}
      }).catch(()=>{
        try{ new Notification('Descanso terminado', opts); }catch(e){}
      });
    } else {
      new Notification('Descanso terminado', opts);
    }
  }catch(e){}
}

/* ============ BOOT ============ */
async function boot(){
  // 1. Cleanup defensivo (phantom sessions de dias passados sem ✓)
  cleanupPhantomSessions();
  recalcPrioridades();
  // 2. Storage seguro (resistente a ITP) — protege localStorage E IndexedDB de eviction
  await requestPersistentStorage();
  // 2b. Migra fotos antigas (base64 no localStorage) pro IndexedDB, não-destrutivo
  try{ await migratePhotosToIDB(); }catch(e){ console.error('[migração fotos]', e); }
  // 3. Aviso de quota se >80%
  await checkStorageQuota();
  // 4. Banner A2HS se não estiver em modo standalone
  maybeShowA2HSBanner();
  // 5. Backup reminder semanal (delay 1.5s pra não competir com outros toasts no boot)
  setTimeout(checkBackupReminder, 1500);
}
recalcPrioridades();   // antes do 1º render
try{ registrarDeloadEmCurso(); }catch(_){}   // a semana leve marca a si mesma: MG_PRIORITY depende do bloco ativo
setTimer(90);
try{ autoDetectDeload(); }catch(_){}   // semana leve se marca sozinha, sem depender de botão
render();
boot();
